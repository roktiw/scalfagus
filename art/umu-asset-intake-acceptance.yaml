status: design_only_checks_no_external_pack_installed_and_no_Godot_render_tests_run
human_specification: art/umu-ready-made-asset-shortlist-2026-10-12.md
candidate_catalog: art/umu-ready-made-asset-catalog.yaml
owner_decisions: [DEC-017, DEC-030, DEC-033, DEC-034, DEC-040, DEC-041, DEC-042]
feature_scope: post_MVP0
DO_NOT_modify_current_MAN_mirror_ROSTER: true
safe_procedure:
  phase_0:
    title: no_install_asset_research
    current_task_is_only: discovery_and_GitHub_MD_YAML
    package_installation_authorized_by_current_request: false
    downloaded_file_inventory: []
    tracked_repo_new_third_party_binary_meshes: []
  phase_1_if_user_explicitly_selects_pack:
    action: download_original_publisher_archive_to_isolated_staging
    evidence: [source_original_URL, actual_ZIP_license_text, source_publisher, asset_version, date_checked, ZIP_sha256, actual_model_list, actual_texture_list]
    reject_on: [not_authorized, missing_license, unknown_provenance, archive_contains_unexpected_programs, downloaded_model_nonmatching_listed_license]
  phase_2_art_prototype:
    action: import_selected_CC0_parts_and_assemble_one_original_tracked_UMU
    source_project_separated_from_MVP0_release_runtime: true
    required_parts: [core, belt_wing_left, belt_wing_right, open_trapezoid_cage, roof_socket]
    render_five_views_and_track_actual_world_sockets: true
  phase_3_role_visual_poses:
    actions: [move_tracks, warehouse_left, warehouse_right, conveyor_3, conveyor_5, bunker, sentry_wall]
    higher_role_preview_optional: [power_generator, harvest, building_drive]
  phase_4_legal_art_approval:
    actions: [check_Godot_import, test_all_mode_colliders, review_atlas_and_mirrors, approve_publisher_assets_with_hashes, do_not_ship_unreviewed_materials]
