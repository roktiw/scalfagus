asset_render_pipeline:
  runtime_game_renderer: Godot_Sprite3D_on_real_3D_world
  authored_camera_angles: [front, front_right, right, back_right, back]
  displayed_sectors: 8
  one_authoritative_asset_family_per_entity: true
  source_mesh_format_preferred_if_available: glTF_2_0
  physical_rendering_and_hitbox_separate: true
  authored_animation_states: [move_tracks, warehouse_left, warehouse_right, conveyor_3, conveyor_5, bunker, sentry_wall]
  extended_later_poses: [power_generator, harvest, building_drive]
  3d_model_parts_are_art_only_without_authoritative_role_state: true
  dynamic_Belt_transform_and_port_side_requires_five_view_mirror_qa: true
  proposed_start_frame_px: [128, 96]
  proposed_frame_size_owner_approved: false
  wide_conveyor_can_have_larger_alpha_frame_bounds: true
  temporary_source_rig_is_original_derivative_kitbash: true

provenance_and_security_gates:
  prefer_original_source_link: true
  inspect_pack_ZIP_license_text: true
  keep_original_zip_sha256_and_each_imported_mesh_hash: true
  keep_source_url_author_license_date_version_per_pack: true
  inspect_texture_and_material_license: true
  stage_in_quarantine_not_current_shipping_assets_until_review: true
  no_runtime_asset_download_or_telemetry: true
  no_executable_bundle_scripts_without_review: true
  no_installation_without_explicit_user_approval: true
  no_license_assumptions_based_only_on_FBX_or_Godot_format: true
  check_original_IP_or_nonlicensed_model_reposts: true

review_criteria:
  - visual_match_to_two_actual_persistent_transforming_wings
  - recognisable_MID_and_MAX_role_without_overcomplicating_asset_roster
  - coherent_warehouse_generator_bunker_wall_readability
  - low_poly_model_and_pixel_5_view_atlas_BENCHMARK_NOT_YET_EXECUTED
  - collision_preserves_finite_packet_and_occupant_manifest
  - license_and_source_evidence_captured_as_manifest
  - compiled_sprite_camera_flip_cannot_move_actual_world_ports
  - no_UMU_in_first_MAN_mirror_MVP0_without_new_owner_release_decision
