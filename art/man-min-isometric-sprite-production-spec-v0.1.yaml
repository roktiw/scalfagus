schema_version: 1
project: scalfagus
version: 0.1
status: proposed_not_yet_rendered_or_engine_tested
specification: art/man-min-isometric-sprite-production-spec-v0.1.md
source_standard: art/sprite-resolution-and-camera-profile-v0.1.yaml
faction_id: man
faction_name: Manus
faction_name_mid: Manusians
template_id: man.worker.min
unit_role: worker
chassis_scale: min
visual_thesis: human_in_pressure_suit_with_light_exoskeleton_not_a_robot
visual_cues:
  style: [snes_genesis_nineties_pixel_art, cute_lunar_expedition, pragmatic_industry]
  primary: [big_rounded_helmet, blue_glass_visor, white_pressure_suit, orange_small_exo_braces]
  secondary: [squared_backpack, modular_tool_socket, utility_pouches, thick_work_boots]
  avoid:
    - heavy_power_armor_as_default_worker
    - identical_humanoid_suits_for_all_man_units
    - copied_existing_game_character_silhouette
    - full_humanoid_robot_as_only_worker_fantasy
    - unedited_concept_poster_as_sprite_sheet
  asymmetry: slight_real_mechanical_function_not_random_decoration
world_projection:
  kind: dimetric_2_to_1
  game_camera: Godot_Camera3D_orthographic
  azimuth_degrees_approx: 45
  elevation_degrees_approx: 30
  world_cell_size: [1, 1]
  iso_diamond_screen_px: [32, 16]
  optional_detailed_diamond_px: [64, 32]
  actor_footprint_cells: [1, 1]
  render_anchor: ground_feet_bottom_center
  foot_shadow_separate_from_body: true
  collision_from_world_actor_not_pixel_rectangle: true
sprites:
  gameplay_core:
    frame_size_px: [24, 32]
    pivot_px_zero_based: [12, 30]
    rgba_alpha: true
    nearest_neighbor_sampling: true
    authored_at_resolution_not_auto_downsampled: true
    canonical_file: man_worker_min_base_24x32_8dir.png
    initial_file: man_worker_min_base_24x32_4dir.png
    source_suggested: man_worker_min.aseprite
  hero_close_overlord:
    frame_size_px: [32, 48]
    pivot_px_zero_based: [16, 45]
    independently_authored: true
    exact_core_outline_at_higher_pixel_density: not_required
    use_when_zoom_allows_visual_legibility: true
    canonical_file: man_worker_min_hero_32x48_8dir.png
    status: later_visual_production
  shadow:
    approximate_bounds_px: [14, 4]
    follows_world_foot_position: true
    gameplay_collision: false
    layer: separate
  selection:
    underlying_geometry: world_square_cell
    visible_ground_shape: 2_to_1_diamond_four_corners
    style: square_corner_brackets_follow_footprint
    faction_shape_language: squares_orthogonal_modules
    layer: separate
    cannot_replace_hit_testing: true
  equipment_layers:
    - squared_backpack
    - wrist_tool
    - repair_manipulator
    - scanner
    - cargo_package
    - antenna_and_lights
    - tool_fx
    - shadow
    - selection
  occlusion_depends_on_facing: true
  allow_equipment_canvas_extension_not_frame_crop: true
anatomy_24x32_guide:
  helmet:
    approximate_bounds_px: [7, 2, 11, 10]
    visor_patch_px: [6, 5]
    highlight_pixels: [1, 2]
  neck_gasket:
    y_px: [11, 13]
  squared_torso:
    approximate_bounds_px: [7, 12, 11, 10]
  arms:
    left_bounds_approx: [3, 12, 6, 12]
    right_bounds_approx: [16, 12, 6, 12]
  backpack:
    width_px_range: [5, 8]
    y_px: [10, 21]
  legs:
    y_px: [21, 30]
    short_with_visible_boots: true
  exo_braces:
    location: [hips, knees, forearms]
    functional_and_lightweight: true
  insignia:
    physical_detail_requires_lod: true
    readable_icon_in_hud: true
art_palette_proposal:
  max_authored_ramp_colors_before_exceptions: 16
  transparency_separate: true
  colors:
    outline_deep: "#0C1626"
    outline_soft: "#223148"
    suit_shadow: "#8295AF"
    suit_mid: "#CED5DD"
    suit_highlight: "#FFF3E4"
    visor_deep: "#0B3159"
    visor_mid: "#1567AF"
    visor_glint: "#58C8FC"
    blue_dark: "#174D88"
    blue_enamel: "#268BDE"
    industrial_orange_dark: "#AF571C"
    industrial_orange: "#F49A2B"
    industrial_orange_light: "#FFD081"
    mechanical_joint: "#26374A"
    outsole_mid: "#52637C"
    neutral_white: "#FFFFFF"
  light_direction: screen_top_left
  anti_aliasing: false
  gradients: small_pixel_ramps_not_smooth_blurs
  dithering: very_sparing_only_when_adds_texture
  no_color_only_states: true
directions:
  world_space_order: [N, NE, E, SE, S, SW, W, NW]
  independent_cardinal_art_in_spike: [N, E, S, W]
  final_all_8_authored: true
  permitted_mirroring: only_if_symmetrical_gear_and_handedness_validated
  orientation_angle_derived_from: actor_world_yaw_relative_to_overlord_camera
  pivot_static_across_all_facing_frames: true
  screen_movement_does_not_define_stationary_aim_direction: true
atlas:
  logical_frame_order: [idle_0, idle_1, walk_0, walk_1, walk_2, walk_3, work_0, work_1, work_2, work_3, carry_0, carry_1]
  frame_slots_per_direction: 12
  early_spike:
    direction_rows: [N, E, S, W]
    columns: 12
    rows: 4
    frame_size_px: [24, 32]
    atlas_size_px: [288, 128]
    total_frames: 48
  eight_directions_core:
    direction_rows: [N, NE, E, SE, S, SW, W, NW]
    columns: 12
    rows: 8
    frame_size_px: [24, 32]
    atlas_size_px: [288, 256]
    total_frames: 96
  detail_lod_when_authored:
    direction_rows: [N, NE, E, SE, S, SW, W, NW]
    columns: 12
    rows: 8
    frame_size_px: [32, 48]
    atlas_size_px: [384, 384]
    total_frames: 96
  animation_states:
    idle: {frames: 2, fps_proposal: 3}
    walk: {frames: 4, fps_proposal: 7}
    work_generic: {frames: 4, fps_proposal: 7}
    carry_and_unload: {frames: 2, fps_proposal: 4}
  later_action_states: [extract, build, repair, scan, hit, death, special_hero_ability]
loadouts:
  shared_body_template: man.worker.min
  field_engineer:
    tools: [wrist_constructor_drill, utility_pouch]
    pose: short_ground_work_and_welding
    proposed_visual_baseline: true
  repair_technician:
    tools: [squared_pack_with_articulated_repair_arm, torch]
    pose: manipulator_contact_and_sparks
    proposed_visual_baseline: false
  prospector_scout:
    tools: [sensor_mast, handheld_scanner, sample_case]
    pose: aim_scanner_and_sweep_cone
    proposed_visual_baseline: false
  logistics_crewman:
    tools: [compact_load_harness, visible_cargo_crate]
    pose: grab_lift_carry_unload
    proposed_visual_baseline: false
  gameplay_template_count: one_initial_worker_with_equipment_not_four_separate_unit_archetypes
  hero_starter_kits_unlocked_by_camera: false
  hero_camera_modes: [overlord, direct_unit, full_fps]
render_pipeline:
  authoritative_runtime: Godot_native_3D_world
  overhead: directional_AnimatedSprite3D_or_Sprite3D_frames
  direct_unit: shared_world_actor_closer_orthographic_view
  fps: first_person_3D_or_authored_close_proxy_same_actor_id
  never_replace_gameplay_actor_on_camera_switch: true
  pixel_alpha_edges_checked: true
  ui_independent_of_world_zoom: true
  camera_zoom_discrete_pixel_perfect_steps: [0.5, 1, 2, 3, 4, 6, 8]
  smooth_zoom_optional_subject_to_nearest_neighbor_shimmer_test: true
  resolutions:
    minimum_4_3: [320, 240]
    alternate_2_1: [640, 320]
    preferred_logical_16_9: [640, 360]
    UHD_output_16_9: [3840, 2160]
    UHD_integer_scale_from_640x360: 6
    letterbox_or_adapt_camera_no_distorted_sprite: true
manifest_requirements:
  required: [asset_id, faction_id, chassis_scale, action, facing, frame_size_px, frame_count, fps, pivot_px, world_footprint_cells, collision_proxy_id, license_source]
  asset_id_example: man.worker.min.walk.ne
  authored_source_extension_proposal: aseprite
  runtime_texture: PNG_RGBA
  runtime_metadata: JSON_from_validated_YAML
tests:
  - man_worker_readable_at_true_320x240
  - distinguish_man_vs_org_and_eth_in_grayscale
  - gear_variants_distinguishable_without_icon_text
  - eight_direction_pivots_do_not_jitter
  - asymmetric_tool_handedness_remains_consistent
  - MAN_square_selection_projects_to_iso_diamond
  - cargo_overlay_changes_only_on_actual_inventory_event
  - hero_sprite_and_fps_proxy_share_actor_ID_HP_weapon_inventory_and_cooldown
  - pixel_edges_have_no_antialias_blur
  - original_licensed_asset_source_and_editable_source_present
milestones:
  A0: one_24x32_iso_silhouette_and_320x240_readability_preview
  A1: four_cardinal_directions_idle_walk_work_carry
  A2: eight_direction_base_plus_correct_pivots
  A3: repair_scanner_cargo_equipment_overlays
  A4: independent_32x48_hero_lod_plus_first_person_proxy
  A5: introduce_other_distinct_MAN_unit_body_families_after_playtesting
