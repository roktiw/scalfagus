schema_version: 1
project: scalfagus
version: 0.1
status: prototype_candidates_not_final_brand_approval
source_art_reference: conversation_image_2026-10-11_three_by_three_faction_emblems
production_technique: hand-coded_nearest_pixel_geometry_not_poster_crop
source_generator: scripts/build-faction-emblems.mjs
atlas_regions: assets/faction-emblems/regions.json
ui_rules: art/faction-ui-iconography-v0.1.md
art_spec: art/faction-emblems-pixel-art-production-v0.1.md
name_canon: design/faction-naming-conventions-2026-10-11.md
resolution_policy:
  native_pixel_sizes: [16, 32, 64]
  native_authored_for_each_size: true
  preview_scaling: nearest_neighbor_integer_only
  runtime_format: png_rgba
  alpha_background: transparent
  not_a_chroma_key: true
  magenta_background: optional_debug_preview_only
  source_poster_is_not_a_sprite_atlas: true
  minimum_safe_interior_separation_px:
    16: 1
    32: 2
    64: 3
  minimum_core_shape_stroke_px:
    16: 1
    32: 2
    64: 3
  corner_padding_target_px:
    16: 1
    32: 2
    64: 4
  preview_downscale_is_not_a_16px_source: true
  forbid_antialiasing_and_subpixel_transform: true
  no_lettering_inside_16px_icon: true
  language_independent_symbols: true
  high_contrast_and_shape_first: true
  faint_or_disabled_icon_requires_outline_not_color_only: true
  selection_or_team_states_are_external_UI_layers: true
  do_not_mirror_text_or_functional_equipment: true
  no_runtime_animated_eye_tracking_default: true

layout:
  atlas_order_rows: [man, eth, org]
  atlas_order_columns: ["01", "02", "03"]
  atlas_grid: {columns: 3, rows: 3}
  icon_region_formula_px: "[variant_index * size, faction_row * size, size, size]"
  faction_row_index: {man: 0, eth: 1, org: 2}
  variant_column_index: {"01": 0, "02": 1, "03": 2}
  atlas_paths:
    16: assets/faction-emblems/faction-emblems-16.png
    32: assets/faction-emblems/faction-emblems-32.png
    64: assets/faction-emblems/faction-emblems-64.png
  atlas_dimensions_px:
    16: [48, 48]
    32: [96, 96]
    64: [192, 192]
  godot_selection: texture_atlas_region_not_directional_actor_sprite
  compatibility_note: faction_heraldry_is_a_UI_decal_not_a_five_view_rotating_world_sprite

factions:
  man:
    machine_id: man
    name_short: Manus
    name_mid: Manusians
    name_full: Manusians Augmented Navigators
    approved_outer_shape: square
    approved_inner_category: human_hand
    color_family: [deep_navy, construction_blue, suit_ivory, utility_orange]
    avoids: [literal_hand_photo, mirrored_text, only_fist_as_generic_warfare_icon]
    variants:
      "01":
        id: man.01
        title: Open Palm / Builder
        motif: open_human_palm_with_central_orange_energy_or_work_node
        candidate_status: preferred_prototype_not_fully_ratified
