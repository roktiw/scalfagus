  - id: vector_cantor
    inspiration: insectoid_ufo_narratives
    working_role: precision_emitter_technician
    silhouette: geometric_three_lobed_sensor_head_and_angular_back_fins
    proposed_frame_px: [32, 48]
    avoid: [generic_bug_walker_same_as_org]
  - id: lens_bound_ascendant
    inspiration: energy_form_folklore
    working_role: rare_resonance_field_specialist
    silhouette: central_dark_core_with_three_offset_rings
    proposed_frame_px: [48, 48]
    avoid: [amorphous_omniscient_blob, free_resurrection]
economic_visual_fixture:
  min:
    type: network_beam_builder
    source_node_required: eligible_larger_node
    pose: anchored_focus_to_visible_blue_beam
    move_while_building: false
    color_is_secondary_to_pose: true
  mid:
    type: modal_pylon
    active_modes: [storage, network_relay, turret]
    transition: visible_meditation_with_cargo_gates_locked
    optional_movement: levitation_after_specialized_meditation
    silhouette_must_differ_from_max: true
  max:
    type: nexus_class_from_start
    silhouette: stepped_monument_dome_and_orbital_halo
    knowledge_pattern_archive: visible_as_animation_prop
    founding_beam: finite_duration_under_visibility_rules
eight_direction_sprite_policy:
  unit_angles: [N, NE, E, SE, S, SW, W, NW]
  prototype_allowed_angles: [N, E, S, W]
  unreviewed_mirroring_for_asymmetric_characters: false
  architecture_rotations_only_when_gameplay_permits: true
quality_gates:
  - silhouettes_read_in_grayscale_at_320x240
  - no_lineage_is_declared_empirically_real
  - skin_color_does_not_determine_moral_alignment
  - faction_remains_eth_even_with_multiple_lineages
  - beam_has_real_constructor_and_node_endpoints
  - full_eight_direction_art_not_required_in_first_mvp
  - source_or_license_recorded_for_any_final_asset
