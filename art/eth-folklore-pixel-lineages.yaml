status: exploratory_fiction_visual_moodboard_not_canonical_species
specification: art/eth-ancient-aliens-folklore-and-pixel-lineages-2026-10-11.md
faction_id: eth
name_mid: Etherans
provenance_notice:
  motifs_come_from: contemporary_ufo_contactee_folklore_and_science_fiction
