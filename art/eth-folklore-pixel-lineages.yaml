  fictional_motifs_only: true
  avoid_copyrighted_costumes_or_signatures: true
art_palette:
  base: [deep_navy, cosmic_black, ceramic_white]
  accents: [electric_blue, lilac, pale_cyan, rare_warm_amber]
  blue_skin_and_eyes_allowed: true
  separate_beams_and_halos_fx: true
  glow_not_required_to_read_silhouette: true
environment:
  structures: [abstract_stepped_pyramid, ziggurat, quasi_sphinx_platform, dome, orb, halo, astronomical_ring, circular_uap_hangar]
  architecture_motif: [interstellar_geometry, measured_asymmetry, precise_curves, negative_space, optional_fibonacci_rhythm]
  fixed_real_world_heritage_copies: false
  cultural_appropriation_caution: true
lineages:
  - id: harmonic_envoy
    inspiration: humanlike_contactee_ashtar_sheran_style_folklore
    working_role: architect_and_pattern_synchronizer
    silhouette: slender_tapered_mantle_and_off_axis_small_halo
    proposed_frame_px: [32, 48]
    avoid: [branded_costume, photoreal_celebrity_or_contactee_portrait]
  - id: orbital_surveyor
    inspiration: grey_alien_reports
    working_role: min_scout_or_courier
    silhouette: large_lens_shaped_head_small_body_asymmetric_sensors
    proposed_frame_px: [24, 32]
    avoid: [identical_pop_culture_grey_face]
  - id: saurian_sentinel
    inspiration: reptilian_folklore
    working_role: hunter_or_guardian
    silhouette: low_stance_wedge_crested_head_tail_and_uneven_armor
    proposed_frame_px: [32, 48]
    avoid: [predator_armor_or_mask_copy, equating_reptile_anatomy_with_evil]
  - id: stellar_archivist
    inspiration: nordic_contactee_folklore
    working_role: historian_seer_and_knowledge_custodian
    silhouette: long_ceramic_frame_and_separate_palm_ring
    proposed_frame_px: [32, 48]
