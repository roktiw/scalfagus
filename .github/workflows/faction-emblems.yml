name: faction-emblems-art-pipeline
on:
  push:
    paths:
      - 'art/faction-emblems-*'
      - 'art/faction-ui-iconography-v0.1.md'
      - 'assets/faction-emblems/**'
      - 'scripts/build-faction-emblems.mjs'
      - 'scripts/test-faction-emblems.mjs'
      - 'scripts/compare-faction-emblems.mjs'
      - '.github/workflows/faction-emblems.yml'
  pull_request:
    paths:
      - 'art/faction-emblems-*'
      - 'art/faction-ui-iconography-v0.1.md'
      - 'assets/faction-emblems/**'
      - 'scripts/build-faction-emblems.mjs'
      - 'scripts/test-faction-emblems.mjs'
      - '.github/workflows/faction-emblems.yml'
permissions:
  contents: read
jobs:
  validate-art:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate committed atlas regions and alpha
        run: node scripts/test-faction-emblems.mjs
      - name: Regenerate in isolated directory and verify committed pixels
        run: |
          set -euo pipefail
          OUT="$(mktemp -d)"
          trap 'rm -rf "$OUT"' EXIT
          node scripts/build-faction-emblems.mjs "$OUT"
          node scripts/test-faction-emblems.mjs "$OUT"
          node scripts/compare-faction-emblems.mjs assets/faction-emblems "$OUT"
          git diff --exit-code -- assets/faction-emblems
