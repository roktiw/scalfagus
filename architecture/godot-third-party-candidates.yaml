explicitly_builtin_not_addons:
  - {id: input, upstream: Godot_4_7_2, classes: [InputMap, InputEvent, Shortcut, ConfigFile]}
  - {id: ui, upstream: Godot_4_7_2, classes: [Control, CanvasLayer, Theme, Container, ProgressBar, SubViewport]}
  - {id: picking, upstream: Godot_4_7_2, classes: [PhysicsDirectSpaceState3D, PhysicsRayQueryParameters3D, Camera3D]}
  - {id: pathfinding, upstream: Godot_4_7_2, classes: [AStarGrid2D, NavigationServer3D, NavigationAgent3D, NavigationRegion3D]}
  - {id: movement, upstream: Godot_4_7_2, classes: [CharacterBody3D, CollisionShape3D, StaticBody3D]}
  - {id: network, upstream: Godot_4_7_2, classes: [ENetMultiplayerPeer, MultiplayerAPI, MultiplayerSpawner, MultiplayerSynchronizer]}
  - {id: sprites, upstream: Godot_4_7_2, classes: [Sprite3D, AnimationPlayer, AnimationTree]}
  - {id: resources, upstream: Godot_4_7_2, classes: [Resource, JSON, FastNoiseLite, FileAccess]}
  - {id: test_base, upstream: Godot_4_7_2, classes: [SceneTree, Script, Signal]}

installation_source_lock: architecture/godot-addons.lock.yaml
local_godot_actions_fallback: scripts/check.sh
local_addon_preflight: scripts/install-godot-addons.sh_--check

installation_workflow:
  install_using: [reviewed_tag_or_full_commit, offline_vendoring_inside_apps/game/addons, validate_license_and_authorship]
  enable_editor_plugin_if_plugin_cfg_exists: yes_after_review
  track_lock_fields: [upstream_repo, full_commit_sha, license, sha256_if_binary, host_os, target_os, godot_version, reviewed_by, reviewed_at]
  forbidden: [copying_unspecified_main, modifying_vendor_source_directly_without_fork, addons_network_auto_update, assuming_web_GDExtension_support]
  test_gates: [engine_editor_import, SceneTree_smokes, targeted_addon_spike, headless_behavior, native_platform_export, web_if_runtime_addon, manual_GUI_and_input]
