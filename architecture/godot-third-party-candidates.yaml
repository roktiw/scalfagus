schema_version: 1
project: scalfagus
reviewed_on: 2026-10-11
owner_decision: DEC-034
status: reviewed_candidates_some_vendored_not_engine_verified
engine: Godot_4_7_2_Standard
runtime_targets: [macos, windows, linux, web]
policy:
  priority: [existing_repo, godot_built_in, audited_github_module, justified_game_domain_code]
  modules_are_not_installed_by_documentation: true
  approval_requires: [maintainer_and_origin_audit, license_file, pinned_commit, godot_4_7_2_smoke, platform_matrix, license_notice, adapter_boundary, rollback_plan]
  runtime_network_fetch_for_extensions: forbidden
  floating_branch_dependency: forbidden
  new_custom_A_star_or_physics_or_gui_framework_without_exception: forbidden
  no_Tauri_Rust_Vite_runtime: true
  only_one_external_state_machine_engine_at_a_time: true
  canonical_mvp: DEC-033_MAN_vs_MAN_RTS_HH_HC_CC

