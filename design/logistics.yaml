latest_owner_network_data: design/three-network-channels-and-destruction.yaml
world_loot_and_recycling: design/world-loot-and-recycling.yaml
victory_classification: design/victory-defeat-building-classification-2026-10-11.md
version: 1.0
status: approved_core_rules_with_proposed_details
automation: medium
faction_mechanisms:
  specification: design/three-faction-network-and-infrastructure-contract-2026-10-11.md
  historical_faction_logistics: design/faction-logistics-2026-10-11.md
  ether_network: design/eth-ether-network-mechanics.yaml
  man_power_org_vessels: design/man-power-dock-and-org-vessel-mechanics.yaml
  config: design/faction-logistics.yaml
  base_ecology: design/base-ecologies.yaml
  economic_chassis: design/logistics-unit-scales.yaml
  physical_resource_forms: design/physical-resource-forms.yaml
  org: finite_live_vessel_material_energy_information_transfer_plus_mitochondria_and_mother_loops
  man: umu_ground_mobile_generator_warehouse_or_bunker_plus_real_material_haul_and_hybrid_cable
  eth: unified_ether_network_freight_energy_information_after_nexus_input_conversion
  note: Preserve common finite inventories, geometry, capacity and manual-order authority.
player_controls:
  - select_deposit_and_assign_workers
  - place_transfer_points_and_storage
  - designate_destination_or_route
  - choose_island_or_asteroid_for_expansion
  - initiate_docking_operations
  - change_strategic_routes
  - designate_org_vessel_branch_and_expansion_nourishment_route
  - reposition_man_modular_base
  - authorize_eth_min_network_construction_and_blueprint_sync
automatic:
  - repeat_ordered_extraction
  - transfer_cargo_when_compatible_receiver_in_range_and_has_capacity
  - return_full_cargo_to_configured_destination
  - basic_pathfinding_around_inaccessible_terrain
  - queued_transfer_at_configured_points
not_automatic:
  - independently_choose_new_expansion_sites
  - build_new_economy_without_orders
  - optimize_global_strategy
  - autonomously_claim_remote_deposits
transfer:
  permitted_chain: [min_to_mid, min_to_max, mid_to_max]
  source_of_truth: design/economy.yaml
  supports_resources: [matter, volatiles, energy]
  physical_source_forms: [solid, liquid, gas]
  form_access_gates:
    solid: manual_worker_gather_without_mine
    liquid: slow_small_direct_worker_draw_or_optional_pump
    gas: raw_source_requires_completed_collector
  packaging:
    solid: finite_loose_sack_or_crate
    liquid: sealed_vessel_cistern_or_flask
    gas: pressurized_sealed_canister_or_processed_output
  man_conveyor_uncontained_liquid_or_gas_forbidden: true
  energy_is_not_gas: true
  physical_form_to_spendable_resource_mapping: TBD
  needs_receiver_capacity: true
  needs_transfer_range_and_compatibility: true
  energy_as_cargo: true
  ethos:
    valid_nexus_conversion_required_before_ether_transfer: true
    ether_payload_preserves_underlying_resource_type: true
    single_network_components_keep_own_actual_balances_on_split: true
    broken_ether_edge_packet_escrow_can_emerge_as_world_orb: true
    last_blue_beam_loss_drops_all_committed_inputs_at_site: true
    equalization_is_capacity_weighted_and_bandwidth_limited: proposed
    no_unlimited_global_teleport_wallet: true
  manus:
    physical_material_transport_not_hybrid_data_power_cable_material_transfer: true
    umu_reuses_existing_mobile_warehouse_bunker_chassis_as_candidate: true
    builder_can_fetch_from_eligible_local_source_transporter_depot_or_nexus: true
    auto_connected_power_ports_carry_finite_power: proposed
  organs:
    living_vessels_carry_finite_actual_resource_packets_nutrition_energy_and_information: true
    pair_of_mitochondria_generate_actual_energy_scope_TBD: true
    dying_organ_buildings_spit_recoverable_partial_materials: true
  rates_and_docking_delays: refer_to_economy_pending_migration
  simultaneous_loaders:
    org_min_worker_per_operation: 1
    org_mid_max_initial_concurrent_handoffs: 1
    org_mid_max_initial_items_per_handoff: 1
    org_extra_ports: technology_gated_TBD
    note: Single cargo item means a transfer portion, not an entire slot or cargo hold.
  org_mother_initial_modes: [move, receive, dispatch, extract]
  org_mother_initial_modes_mutually_exclusive: true
  org_mother_moving_handoffs: unlocked_via_upgrades_not_baseline
  queue_priority: TBD
  fallback_if_receiver_destroyed: TBD
asteroids:
  movement: slowly_drifting
  docking_player_ordered: true
  travel_route_recalculation: basic
  automatic_strategic_retargeting: false
  docking_when_target_moves: TBD
failure_modes:
  full_storage: TBD
  interrupted_transfer: TBD
  obstructed_route: TBD
  dropped_or_lost_cargo: TBD
  congestion: TBD
metrics: [delivered_resources_per_minute, idle_time, congestion, lost_cargo, travel_distance]
