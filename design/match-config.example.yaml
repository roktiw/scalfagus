# Scalfagus — illustrative match configuration schema (proposal, not runtime contract)
schema_version: "0.1-draft"
session_context: skirmish # campaign | skirmish | multiplayer
match_scale: min # min | mid | max; match duration/complexity, NOT chassis size
control_preset: autonomous_rts # classic_rts | architect | commander | avatar | hybrid
objective_ruleset: annihilation # annihilation default | heartstrike optional | control | escort | extraction | custom
# Default annihilation: every last enemy building must be lost, including
# ground-mobile units tagged victory_building even while packed/traveling.
# Heroes, ordinary workers, soldiers, crates, cables and unfinished sites do not count.
# Heartstrike is an OPTIONAL alternate ruleset requiring designated team heart anchors.
map: verdant_divide # first playable map; every playable map must have a flying-space-platform frame (DEC-030)
world:
  topology: planar
  gravity: uniform
battlefield_frame:
  variant: floating_space_platform
  required_for_all_playable_maps: true
  visible_rim_and_underside: true
  noninteractive_space_background: true
  boundary: four_sided_hard_collision
surface_preset: brown_soil_jungle # later: industrial_metal_patchwork, rocky_desert, ...
# Bare terrestrial surfaces or bounded_planetary_surface are NOT valid map frames.
# The authoritative complete platform shape, water, trees, resources and spawns
# are defined in design/mvp-verdant-divide-map.yaml, not invented by lobby config.
seed: 357
first_mvp:
  playable_factions: [man, eth]
  resource_source_forms_collectible: [solid]
  maps_must_contain_liquid_terrain_but_liquid_not_collectible: true
  movement_domains: [ground]
  default_victory: destroy_all_enemy_completed_building_class_entities
  no_spherical_gravity_or_interplanetary_travel: true
teams:
  format: "1v1"
  shared_faction_control: true
rules:
  base_ai: autonomous # off | assist | autonomous
  strategy_ai: execute # off | suggest | execute
  worker_ai: full # off | doctrine | full
  combat_ai: doctrine # manual | doctrine | autonomous
  possession: disabled # enabled after the FPS feature is implemented
  player_roles: unrestricted # advisory | enforced (later)
  fog_of_war: on
  unit_progression: on
  replay: on
  structural_elimination:
    count_building_class_unit_templates_as_buildings: true
    mode_changes_do_not_change_victory_building_tag: true
    unfinished_scaffolds_and_loose_salvage_do_not_delay_defeat: true
    determine_at_end_of_authoritative_tick: true
  # heartstrike_target_by_team: set only when objective_ruleset=heartstrike
  salvage:
    physical_ground_drops: true
    finite_lossy_recycling: true
  pause_policy: unrestricted
ai_policy:
  economic_posture: balanced # fortify | expand | tech | rush
  expansion_allowed: true
  manual_override_protection: true
  require_approval_for_critical_actions: false
# A resolver must validate feature availability, preset overrides, ranked restrictions,
# map/objective compatibility and deterministic serialization before launching a match.
