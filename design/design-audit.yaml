schema_version: 1
project: scalfagus
version: 0.5
status: design_audit_backlog
language: en
scope:
  source: reviewed_design_documents_and_design_conversation
  caveat: Full repository tree and all non-design files were not enumerated; repo-wide language verification is incomplete.
principles:
  - Approved decisions are separate from speculative parameters.
  - Default faction playstyles are guidance, not restrictions.
  - Economic efficiency indices are not match win rates.
  - Three resource tiers and three geographic tiers are independent.
  - A tier indicates chassis scale, not unconditional combat superiority.
  - Balance must consider combat, economy, logistics, abilities, geography, and information together.
