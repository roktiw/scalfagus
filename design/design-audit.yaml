acceptance_criteria:
  - All official game economy definitions use matter, volatiles, energy.
  - All playable factions have at least one viable strategic response in every phase.
  - 1v1 duration is measured against the 25-40 minute target, not forcibly capped.
  - Automated transfers require prior player directives and valid receiver capacity.
  - Only units explicitly marked deployable can become structures.
  - Balance is assessed on a representative map pool and skill-matched matchups.
