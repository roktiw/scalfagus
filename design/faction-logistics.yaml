schema_version: 1
project: scalfagus
version: 0.2
status: owner_approved_identity_with_proposed_mechanics
specification: design/faction-logistics-2026-10-11.md
canonical_resources: [matter, volatiles, energy]
core_rule: faction_determines_logistics_physics_player_determines_architecture
identity_variation_ratio: qualitative_80_20_not_numeric_balance
common:
  deterministic_simulation: true
  authoritative_finite_inventories: true
  cargo_conservation: true
  finite_transfer_rates: true
  geometry_and_range_required: true
  resource_energy_not_mandatory_power_grid: true
  independent_specialized_units: true
  autonomous_routine_delivery: true
  player_orders_precede_automation: true
  strategic_expansion_requires_permission: true
factions:
  org:
    name_mid: Organites
    model: living_loops
    signature: mother_transporter_loop_with_tech_gated_moving_handoffs
    core_elements: [extractor_workers, loader_workers, mobile_mother_carrier, unloaders_or_receiving_dock]
    movement: repeating_player_configured_source_base_loop
    initial_route_behavior: fly_stop_load_fly_stop_unload
    base_mother_modes: [move, receive, dispatch, extract]
    base_mother_modes_mutually_exclusive: true
    base_transfer_rules:
      items_per_completed_handoff: 1
      worker_concurrent_transfer_operations: 1
      mid_max_concurrent_handoffs_per_transporter: 1
      one_worker_per_transporter_transfer_port: true
      receiver_slot_capacity_still_matters: true
    loading:
      mother_can_continue_moving: false
      range_limited: true
      time_window_limited: true
      rate_limited: true
      compatible_sender_required: true
      available_receiver_capacity_required: true
    unloading:
      mother_can_continue_moving: false
      rate_and_range_limited: true
      destination_capacity_required: true
    technology_progression:
      early:
        mother_modes: mutually_exclusive
        transfer_ports_mid_max: 1
        items_per_handoff: 1
        moving_handoffs: false
      mid_proposed:
        moving_while_receiving_or_dispatching: true
        ports_per_transporter: 1
        harvest_overlap: false
      late_proposed:
        additional_ports: TBD
        simultaneous_inbound_outbound: costed_and_bandwidth_capped
        each_worker_still_has_finite_handoff_rate: true
        harvest_overlap: requires_separate_specialist_upgrade
      upgrade_costs_and_timing: TBD_after_playtests
    scaling: [worker_count, mother_count, mother_cargo_capacity, organism_growth, transfer_port_upgrades]
    critical_asset: mother_transporter
    loss_policy: TBD
    proposed_doctrines: [swarm, giant, symbiosis]
  man:
    name_mid: Manusians
    model: industrial_belts
    signature: continuous_destructible_conveyor_flow
    core_elements: [industrial_extractor, belt_segments, splitter_merger, finite_buffer, depot]
    scaling: [belt_speed, parallel_lanes, junction_efficiency, storage_buffers]
    breakage_interrupts_flow: true
    backpressure_required: true
    critical_asset: chokepoint_belt_or_junction
    mobile_fallback: proposed_emergency_hauler
    proposed_doctrines: [belt, rail, automation]
  eth:
    name_mid: Etherans
    model: resonance_hubs
    signature: mobile_couriers_between_static_pylon_hubs
    core_elements: [source_extractor, mobile_courier, stationary_pylon, finite_pylon_buffer, destination]
    stationary_pylons: true
    pylon_inbound_outbound_queues: finite
    courier_payload_and_travel_time: finite
    free_teleportation: false
    scaling: [courier_count, pylon_rate, graph_topology, parallel_paths]
    critical_asset: articulation_pylon
    proposed_doctrines: [relay, mesh, phase]
    phase_costed_energy_shortcut: speculative_not_approved
balance:
  objective: total_cost_and_time_to_deliver_1000_resource_units
  independent_dimensions: [first_delivery_latency, sustained_throughput, setup_cost, ongoing_cost, footprint, risk, recovery]
  test_scenarios: [short_range, long_range, chokepoint, interruption, fallback, islands, drifting_asteroids]
  no_arbitrary_global_faction_throughput_bonus: true
implementation:
  phase_0: [shared_inventory_model, org_stopping_mother_loop_single_transfer_port, man_destructible_belt, eth_static_pylon_couriers]
  phase_1: [org_two_mothers_and_contested_workers, man_bypass_and_buffer, eth_mesh_and_hub_attack]
  phase_2: [org_midgame_moving_handoff_upgrade, org_lategame_extra_ports, doctrine_playtests, terrain_docking, competitive_balance]
acceptance_test_ids: [LOG-F01, LOG-F02, LOG-F03, LOG-F04, LOG-F05, LOG-F06, LOG-F07, LOG-F08, LOG-F09, LOG-F10, LOG-F11, LOG-F12, LOG-F13]
