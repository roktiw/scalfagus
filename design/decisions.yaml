schema_version: 1
project: scalfagus
version: 3.1
decisions:
  - id: DEC-001
    status: approved
    topic: energy_resource
    resolution: Energy is the third stored, transportable, spendable resource.
    specification: design/energy.yaml
  - id: DEC-002
    status: approved
    topic: unit_to_structure
    resolution: Only explicitly specialized deployable units may become structures.
    specification: design/deployment.yaml
  - id: DEC-003
    status: approved
    topic: logistics_automation
    resolution: Medium automation; classic RTS commands plus automatic compatible cargo transfer.
    specification: design/logistics.yaml
  - id: DEC-004
    status: approved
    topic: match_length
    resolution: Standard competitive 1v1 targets 25–40 minutes.
    specification: design/match-rules.yaml
  - id: DEC-005
    status: approved
    topic: faction_default_playstyles
    resolution: >-
      Organs emphasize relentless early pressure and biomass-linked clustered bases;
      Manus use scouting, modular strike groups and widely dispersed outposts;
      Eters protect and rebuild a homeworld-like core to survive until late technology.
      These are defaults, never mandatory strategic restrictions.
    specification: design/factions.yaml
  - id: DEC-006
    status: approved
    topic: language_policy
    resolution: All repository documentation, YAML content, comments, and authored text must be in English.
    specification: design/design-audit.md
  - id: DEC-007
    status: approved
    topic: individuality_over_hivemind
    resolution: >-
      All playable civilizations are composed of distinctive specialized units with
      meaningful independent local agency. No mandatory single hive mind, totalizing
      super-organism, amorphous civilization-wide assimilation or free enemy-DNA copying.
      Tactical coordination and enhanced networks remain allowed and must not erase
      unit individuality. This principle does not mean every unit must be sentient.
    specification: design/individual-agency-and-composable-civilizations.md
  - id: DEC-008
    status: approved
    topic: canonical_faction_names
    resolution: >-
      The original three playable civilizations are Organs (org), Manus (man),
      and Eters (eth). Earlier names are obsolete for runtime game data.
    specification: design/faction-naming-conventions-2026-10-11.md
  - id: DEC-009
    status: approved
    topic: faction_three_level_backronym_naming
    resolution: >-
      Keep the stable faction IDs org/man/eth and short labels Organs/Manus/Eters.
      The exact approved mid names are Organites, Manusians and Etherans.
      The exact approved full backronyms are Organites Reproductive Generalismus,
      Manusians Augmented Navigators and Etherans Transcendent Hypervisors.
      They expand ORG/MAN/ETH, and spelling must be preserved verbatim.
      Political state names, if any, remain separate from these faction names.
    specification: design/faction-naming-conventions-2026-10-11.md
  - id: DEC-010
    status: approved_direction_with_proposed_details
    topic: faction_native_logistics
    resolution: >-
      ORG mother transporters follow source/base loops with moving load and unload
      unlocked only after research; MAN build fast but vulnerable physical conveyor networks;
      ETH use mobile couriers and stationary pylon handoff hubs. Faction determines
      logistics physics while the player chooses architecture and resiliency.
    specification: design/faction-logistics-2026-10-11.md
    data_specification: design/faction-logistics.yaml
  - id: DEC-011
    status: approved_core_constraints_with_proposed_upgrade_details
    topic: organite_transport_bandwidth_and_activity_modes
    resolution: >-
      Unupgraded ORG MID and MAX accept or release only one physical resource
      item per completed worker handoff and service only one worker transfer at a time.
      Unupgraded ORG mother transporters are in exactly one mode at a time:
      moving, receiving, dispatching, or extracting. Therefore mother cargo
      routes stop for loading and unloading initially; the previously described
      loading/unloading while flying and moving is a researched mid/late-game
      capability rather than a free starting rule. Upgrade values and costs
      remain proposals requiring balance testing.
    specification: design/logistics-min-mid-max-2026-10-11.md
    data_specification: design/logistics-unit-scales.yaml
  - id: DEC-012
    status: owner_approved_direction_details_tbd
    topic: faction_base_ecologies_and_expansion_dependence
    resolution: >-
      ORG buildings bud only along a physically connected living vascular branch
      rooted at the home Nexus; severed branches wither, and remote expansions
      require recurring nourishment deliveries from home. MAN bases are modular,
      largely relocatable systems of units/structures, supporting independent
      self-sufficient outposts without obligatory home contact. ETH bases are
      networks of pylons and Nexus-class core nodes; a new expansion initializes
      from home and later contacts home only for unknown building blueprints.
      ETH construction MIN units remain in NETWORK mode with a visible blue
      beam to the nearest eligible large node while performing the build.
    specification: design/base-ecologies-and-expansion-2026-10-11.md
    data_specification: design/base-ecologies.yaml
  - id: DEC-013
    status: owner_approved_direction_details_tbd
    topic: revised_economic_chassis_roles
    resolution: >-
      ORG MIN/MID/MAX with growth capability can bud levels L1/L2/L3
      respectively. MAN MIN is a versatile mining, construction and repair
      worker; tracked MID is a 3/5-tile conveyor/relay, one-soldier bunker or
      outward-facing sentry wall; slow land-only MAX is a modular warehouse
      or larger soldier bunker. ETH MIN is an independent gatherer and
      occupied blue-beam NETWORK builder; MID is a pylon in cargo
      storage/relay or meditated turret mode; MAX is a Nexus-class core node
      immediately. Prior proposed ETH mobile MID relay and ETH MAX turret
      pylon roles are superseded.
    specification: design/logistics-min-mid-max-2026-10-11.md
    data_specification: design/logistics-unit-scales.yaml
  - id: DEC-014
    status: open_research_not_approved
    topic: faction_specific_existing_building_relocation
    question: >-
      Whether any existing completed buildings besides already permitted mobile
      modules and selectively levitating Eter structures can be physically
      relocated without weakening RTS expansion geography.
    proposals: >-
      ORG very slow expensive living-vessel transplantation along an existing
      live Nexus-connected branch; ETH faster high-energy resonant network
      railgun-beam transfer between initialized endpoints; MAN further
      selective packing and moving of existing modular buildings.
    constraints_under_consideration: >-
      No universal free all-building mobility, no instantaneous expansion
      bypass, no duplication of structure/cargo/garrison/HP, and visible
      interrupted costed movement respecting map geography and fog of war.
    approved_baseline_unaffected: [DEC-002, DEC-011, DEC-012, DEC-013]
    specification: design/building-relocation-design-options-2026-10-11.md
    data_specification: design/building-relocation-options.yaml
    note: >-
      Discussion recorded but no transplant or railgun transfer approved;
      owner mentioned an additional ETH MAX idea without completing it.
  - id: DEC-015
    status: owner_proposed_mechanic_balance_pending
    topic: staged_asymmetric_construction_and_interruption
    resolution: >-
      ORG living cocoon incubation uses up to 3, then 2, then 1 active caretaker
      per 0-33, 33-66, 66-100 percent stage; workers tend the living spore
      rather than instantly morphing into buildings, and unattended growth
      gradually withers while embodied materials are consumed over time.
      MAN builds physically on site; the newest owner-proposed 1, then 2,
      then 2 simultaneous worker caps may compensate its unusually mobile,
      modular, independently expanding and self-repairing base economy.
      Earlier 2-1-3, 2-3-1 and 1-2-3 variants remain historical alternatives.
      Paused MAN construction persists at its precise built percentage,
      and unfinished/destroyed worksites offer finite real salvage even
      to other factions. ETH NETWORK construction's revised proposed
      caps are 1, then 2, then 3 (replacing earlier 1, then 3, then 2);
      loss of the last required beam/link causes full construction
      progress loss with a bounded resource refund to actual source inventories
      through valid finite return logistics. Labor caps are upper bounds,
      not compulsory worker counts.
    open_balance: >-
      Whether the owner-proposed MAN 1-2-2 labor cap sufficiently offsets
      mobile independent expansions remains a playtest question; 2-1-3 and
      2-3-1 are prior alternatives. ETH 1-2-3 remains exploratory. Exact stage durations,
      additional-worker speed modifiers, ORG caretaker final cocoon-entry
      sacrifice or animation, incubation decay, ETH disconnect grace (if any),
      and material recovery percent/cost remain unspecified; balanced faction
      construction has not been demonstrated.
    specification: design/construction-incubation-assembly-resonance-2026-10-11.md
    data_specification: design/construction-phases.yaml
  - id: DEC-016
    status: owner_approved_extraction_gates_resource_mapping_unresolved
    topic: solid_liquid_gas_physical_source_classes
    resolution: >-
      Every world resource deposit has a physical extraction form: solid,
      liquid, or gas. Dispersed loose SOLID deposits are directly gatherable
      by an independent MIN worker without a mine or other extraction
      structure, analogous to classic RTS surface harvesting. LIQUID sources
      can be tapped directly by an eligible worker at low throughput with
      small sealed cargo, or efficiently via optional installed pump and
      tank infrastructure. GAS sources require a completed compatible
      extraction/capture installation before any gathering; no worker can
      directly harvest an uncaptured gas vent. Actual extraction and
      transport remain finite, physical, and per-faction compatible.
    compatibility: >-
      The approved primary spendable resource IDs matter, volatiles and
      energy remain unchanged for now. Physical form is distinct from a
      spendable resource identity. Energy is not a gas, nor does a gas
      deposit directly equal the energy resource. The exact form-to-resource
      extraction/conversion mapping requires a separate owner decision,
      alongside migration of historical crystals/gas/resin data.
    anti_softlock: >-
      Every start needs solid surface materials; the liquid manual mode
      is a fallback, and the first gas capture rig must be buildable with
      resources available without harvesting that gas first.
    specification: design/physical-resource-forms-and-extraction-2026-10-11.md
    data_specification: design/physical-resource-forms.yaml
  - id: DEC-017
    status: approved_first_prototype_direction_not_yet_visually_tested
    topic: five_source_sprite_views_mirror_to_eight_one_atlas_all_camera_modes
    resolution: >-
      The first Scalfagus 3D-world sprite-rendering prototype shall use five
      unique authored horizontal viewpoints per object action (front,
      front-right, right, back-right, back), mirrored to display eight camera-
      relative 45-degree sectors. The camera itself rotates freely 360 degrees
      and smoothly zooms and changes between Overlord RTS, Direct/TPP and
      first-person possession, while the SAME source visual view family
      represents the object in every camera mode. Visual sprite orientation
      depends on the observer bearing relative to actor forward: use the
      camera world position for perspective and the common camera view axis
      for orthographic; never treat camera yaw alone as sufficient. There is
      one real 3D terrain and collision world and one authoritative actor.
      This supersedes previous default expectations of 8/16 unique authored
      directions and a mandatory second top-down/FPS sprite family.
    mirror_policy: >-
      Horizontal mirroring is allowed only when anatomy, equipment, markings
      and functional building doors or ports remain artistically consistent.
      Prefer symmetric source design or a separate world-anchored overlay;
      explicit eight-unique-view exceptions require a failed proof and review.
    open_visual_risks: >-
      A single azimuth-only sprite family does not reconstruct camera pitch,
      roof/underside parallax, close FPS occlusion or all asymmetric shapes.
      A proof with a MAN worker, lunar lander, tree, rock and terrain must
      verify those limitations before mass sprite production. The artist and
      engineer may propose exceptions after evidence; no guaranteed solution
      or tested Godot gameplay is implied by this decision.
    specification: architecture/adr-0003-five-view-mirrored-3d-sprites.md
    data_specification: art/directional-sprite-five-view-v0.1.yaml
    conversation_record: research/five-view-mirroring-renderer-discussion-2026-10-11.md
  - id: DEC-018
    status: owner_approved_ether_conversion_and_partition_concept_distribution_algorithm_proposed
    topic: eth_ether_network_as_typed_resource_freight_and_farm
    resolution: >-
      ETH Pylon and Obelisk are one starting fixed infrastructure building,
      using the established MID pylon chassis: network/information and
      resonance-support node, a typed-Ether storage/relay in resource mode,
      or a meditated turret in defensive mode. The existing ETH MAX is a
      Nexus-class authority and conversion endpoint. After physically harvested
      cargo actually reaches a Nexus, it can be represented as typed Ether
      and passed between connected pylons, while preserving exact tracked
      resource identity, finite balances and consumption at building sites.
      Ether is a transport/storage representation and not a fourth primary
      spendable currency. When the Ether freight graph splits, each subgraph
      retains only resources actually held by its nodes at the split tick:
      no duplicated pools, invented equal division or transfer to unreachable
      headquarters. An initialized expansion can operate using its accessible
      local stock and known blueprints, subject to valid building beams.
    proposed_protocol: >-
      Fair equalization targets each node's proportional storage fill by
      resource category while constrained by finite link and node bandwidth,
      latency, reservations and port modes. A turret retains signal/support
      connectivity but closes normal Ether freight service by default.
      Connection and movement upgrades, pylon loss/capture policy and
      conversion processing costs remain unresolved.
    supersedes: >-
      Previous physical-courier-only transfers between ETH MID pylons and
      a separate mandatory pylon-versus-obelisk farm building. Initial ETH
      courier-to-Nexus movement, construction blue beam and MAX Nexus
      class remain mandatory where previously required.
    specification: design/three-faction-network-and-infrastructure-contract-2026-10-11.md
    data_specification: design/eth-ether-network-mechanics.yaml
    acceptance_scenarios: design/network-mechanics-acceptance-cases.yaml
  - id: DEC-019
    status: owner_approved_man_ground_mobile_power_depot_bunker_direction_connection_and_template_open
    topic: man_ground_power_dock_energy_and_physical_material_delivery
    resolution: >-
      The basic MAN infrastructure module is mobile only over land,
      integrates energy generation and changes between a warehouse/depot
      and bunker/fortified service mode with finite tradeoffs. MAN
      construction uses physical materials delivered locally from
      an eligible transporter, a MAN Nexus/component/depot or directly
      gathered and carried from legal resource sources. A wired electric
      grid can share power but cannot send physical building materials
      as a magic shared material bank. Isolated MAN expansions remain
      independent with sufficient local power, equipment and stock.
    proposed_protocol: >-
      For MVP, deployed compatible modules automatically form visible
      short-range electric port/cable links; local power grid components
      have bounded throughput and batteries, while traveling modules
      disconnect. Candidate Power Dock may be a small basic module or
      a kit on an existing tracked chassis; keep it weaker and smaller than
      established MAN MID belt/one-person bunker and MAX heavy
      warehouse/multi-soldier bunker. Exact modes and ratios need tests.
    specification: design/three-faction-network-and-infrastructure-contract-2026-10-11.md
    data_specification: design/man-power-dock-and-org-vessel-mechanics.yaml
    acceptance_scenarios: design/network-mechanics-acceptance-cases.yaml
  - id: DEC-020
    status: owner_reaffirmed_org_vessel_dependency_with_proposed_service_details
    topic: org_nutrient_vessels_are_not_shared_ether_wallet
    resolution: >-
      ORG budding requires a physically live connected vessel to original
      home Nexus; the living vessel graph serves structural and metabolic
      sustenance, not freely pooled global Matter/Volatiles/Energy inventories.
      Actual ordinary construction materials are handled by physical workers,
      MID handlers and stop-to-load flying mothers. Remote colonies additionally
      require ongoing physical nourishment deliveries originating at home.
      Cutting vessels causes staged decay/starvation after finite reserves
      rather than an ETH-style partition into spendable abstract subnet wallets
      or the instant loss of independently acting living units.
    specification: design/three-faction-network-and-infrastructure-contract-2026-10-11.md
    data_specification: design/man-power-dock-and-org-vessel-mechanics.yaml
    acceptance_scenarios: design/network-mechanics-acceptance-cases.yaml
  - id: DEC-021
    status: owner_approved_latest_network_topology_with_mitochondria_scope_and_cable_numbers_open
    topic: org_two_man_three_eth_one_networks_and_universal_man_unit
    resolution: >-
      The newest faction-network contract is ETH ONE Ether Network
      carrying typed resources, Energy and information, with pylon/obelisk
      relays acting like Settlers flags, Nexus-only conversion from physical
      raw cargo, and real preserved subnet inventory on rupture. ORG has
      TWO cooperating responsibilities: one physically connected living
      VESSEL network that transfers finite actual resources, nutrition,
      Energy and information, and a system of energy-producing
      MITOCHONDRIA; the owner specified building TWO mitochondria to
      obtain Energy, while exact per-colony versus per-network scope is
      open. MAN has THREE responsibilities: a ground-only
      Universal Man Unit (UMU) acting as deployed power generator and
      warehouse or bunker; separately moved actual construction-material
      packets; and a distinct physical Energy-plus-information cable
      infrastructure. MAN UMU is the owner-selected name.
    proposed_mechanisms: >-
      Prototype UMU as a generator-capable configuration of existing MAN
      MAX heavy warehouse/bunker instead of duplicating its entire chassis.
      Hybrid optical-data and conductive-electricity tethers use one
      player cable order while power and data capacities are distinct.
      ORG first-two-mitochondria must bootstrap from eligible start
      reserves without requiring energy they cannot yet make. ETH
      pylons preserve one underlying connected graph even when turret,
      with reduced freight service balancing still pending.
    supersedes: >-
      Any DEC-018 suggested physically separate control/freight networks
      for ETH; any DEC-020 statement that ORG veins can carry nourishment
      but NOT other real typed resources; any DEC-019 implication that
      Power Dock must be a separate extra building rather than the
      owner's UMU, or that light-only optical fiber transmits bulk power.
      Earlier logistical chassis remain where not contradicted.
    historical_Nexus_only_conversion_superseded_by: DEC-039
    historical_cargo_conversion_ambiguity_note: >-
      The earlier Nexus-only raw conversion wording is historical.
      DEC-039 adds two finite non-Nexus ingress methods for ETH future
      gameplay while retaining the ONE-network topology and typed
      resource accounting. See DEC-039 for current mechanics.
    specification: design/three-network-channels-and-destruction-2026-10-11.md
    data_specification: design/three-network-channels-and-destruction.yaml
    acceptance_scenarios: design/recycling-and-network-acceptance-cases.yaml
  - id: DEC-022
    status: owner_approved_world_drop_and_interrupt_outcomes_palette_candidate
    topic: physical_pickups_shapes_resource_colors_and_cross_faction_salvage
    resolution: >-
      Real material packets appear as collectible world objects when
      buildings, units, logistics chains or unfinished construction
      break. Origin controls packaging silhouette: ORG tetrahedron,
      MAN cube, ETH round orb. Physical source form controls color:
      SOLID amber, LIQUID cyan and GAS violet (specific hex values
      proposed). Compatible workers from EVERY faction may recover
      or steal packets through real pickup and haul actions.
      ETH interruption of an incomplete active build instantly
      ejects all actually committed material ingredients at the build
      site as orbs, but already consumed channeling Energy/time is
      not regenerated. ORG neglected or severed buds/buildings decay
      and eject some of their embodied matter progressively. MAN
      unfinished scaffolds persist, loose construction crates remain
      collectible, and embedded rubble requires deliberate salvage
      excavation available to every faction.
    anti_exploit: >-
      A dropped item and source-account refund may not both credit the
      same input. Unconverted world ETH orbs need real carriage to
      Nexus for reinsertion into Ether Network. Broken material edge
      cargo has a single custody owner, including actual edge escrow.
    specification: design/world-loot-salvage-and-recycling-2026-10-11.md
    data_specification: design/world-loot-and-recycling.yaml
    acceptance_scenarios: design/recycling-and-network-acceptance-cases.yaml
  - id: DEC-023
    status: owner_approved_recycling_with_irrecoverable_loss_numeric_ratios_open
    topic: lossy_resource_circulation_and_reuse_after_battles
    resolution: >-
      Resources may circulate through collection, structures, combat
      destruction, salvage and rebuilding, and enemy players may
      physically collect battlefield materials. Wreck recycling is
      NOT 1:1 and irrecoverable losses/spent operating inputs make
      successive closed destroy-recover-rebuild cycles net-negative
      without new extraction or explicit external inputs. Intact
      never-installed crates and ETH canceled unfinished construction
      inputs are separate custody transfers and need not incur the
      normal completed-asset recycling penalty.
    risks: >-
      Potential match extension, resource snowball for battlefield
      victor, abusive self-destruction, loot clutter and labor micro
      require playtests, finite stack merges, real reclaim time,
      honest resource ledger and appropriate victory conditions.
    specification: design/world-loot-salvage-and-recycling-2026-10-11.md
    data_specification: design/world-loot-and-recycling.yaml
    acceptance_scenarios: design/recycling-and-network-acceptance-cases.yaml
  - id: DEC-024
    status: owner_approved_default_victory_rule_with_structural_tag_details_proposed
    topic: eliminate_all_enemy_buildings_including_units_that_are_buildings
    resolution: >-
      The DEFAULT Scalfagus competitive/skirmish match is won when
      the opposing team loses ALL living completed BUILDINGS.
      Unit entities classified as BUILDINGS count, including
      ground-mobile MAN infrastructure and pylon-like ETH units;
      their packed, traveling, bunker, warehouse, turret or meditation
      modes cannot make them vanish from defeat checks. Ordinary
      heroes, soldiers, workers, raw resource stacks, unfinished
      scaffolds, debris, cables and vein segments alone do NOT
      prolong a match. Destroying every mobile unit is NOT required;
      exhausting source deposits is NOT the victory criterion.
    implementation_proposal: >-
      Assign each finished structural template a persistent
      victory_building flag that survives legitimate travel/mode
      changes and complete reincarnations. End-of-tick deterministic
      team-owned valid building counts trigger elimination at zero;
      same-tick simultaneous zero defaults to draw. Decide which
      specialized MID configurations qualify before implementation.
      A separate optional Heartstrike objective may use designated
      command modules if explicitly enabled by match configuration.
    specification: design/victory-defeat-building-classification-2026-10-11.md
    data_specification: design/match-rules.yaml
    template_classification: design/victory-building-template-registry.yaml
    acceptance_scenarios: design/victory-defeat-acceptance-cases.yaml
  - id: DEC-025
    status: owner_approved_two_faction_five_role_solid_only_MVP_with_numbers_names_open
    topic: man_vs_eth_MVP_roster_first_jungle_match
    resolution: >-
      MVP gameplay targets MAN and ETH only, initially with five functional
      roles per civilization: one mother/HQ building, one MIN harvester/builder,
      one basic soldier, one infrastructure/farm UMU or Pylon/Obelisk, and one
      soldier-producing barracks. The existing Hero and three camera modes
      remain part of the broader product and can reuse a soldier actor in
      this small content slice. Initial economic gathering uses ONLY surface
      SOLID deposits reachable without mining infrastructure. The first
      battlefield should be an exotic jungle with trees usable as real cover.
      Default victory remains all living completed building-class entities
      lost, including mobile MAN UMU in travel mode.
    candidate_only: >-
      Names Command Core, Rifleman, Sentinel and Manifestation Chamber;
      all HP, costs, source inventories, worker counts, world dimensions,
      initial Energy reserves, hero variant and build durations are
      prototyping fixtures rather than final approved balance.
    design_reference: design/mvp-man-eth-jungle-vertical-slice-2026-10-11.md
    roster_data: design/mvp-man-eth-catalog.yaml
    economy_data: design/mvp-economy.yaml
    combat_data: design/mvp-combat.yaml
    bot_data: design/mvp-bot-behavior.yaml
    agent_handoff: design/AGENT-MVP-IMPLEMENTATION.md
    acceptance_tests: design/mvp-man-eth-acceptance.yaml
  - id: DEC-026
    status: owner_approved_natural_domains_and_land_only_first_MVP
    topic: man_earth_eth_air_org_water_and_nonharvestable_environment_liquids
    resolution: >-
      Natural faction environment themes are MAN=EARTH/land,
      ETH=AIR/atmosphere, and ORG=WATER/aquatic. These are strategic
      identities and future mobility affinities, NOT automatic abilities
      to swim/fly or extra combat multipliers in the first game. First
      MAN versus ETH MVP has ground-only units and no sailing/swimming
      or flying. Maps should visually feature liquid terrain: the first
      Earthlike exotic jungle includes recognizable freshwater ponds
      and streams, while future spacecraft platforms might contain dense
      synthetic liquids and some waterless planets may host other liquids.
      No liquid/gas may be extracted on the first SOLID-only map merely
      because visually present as terrain. Future explicitly exceptional
      dry worlds without open fluid need separate scenario configuration.
    specification: design/world-environments-and-map-authoring-2026-10-11.md
    data_specification: design/world-environments.yaml
  - id: DEC-027
    status: authoring_direction_approved_implementation_geometry_numbers_proposed
    topic: sparse_yaml_terrain_maps_height_liquids_spawns_resources_rasters_and_seed
    resolution: >-
      Maintain a data-authored map manifest before a graphical map
      editor. It must describe terrain height and ramps, traversable
      ground, natural cover trees, liquid bodies, faction-neutral
      starting slots, finite placed deposits and procedural decoration.
      Use stable entity IDs and deterministic compile/validation;
      keep tactical blockers, passable paths, resource balances and
      spawns reproducible. Future lossless raster height/terrain masks
      may supplement, not replace, semantic YAML. First 1v1 topology
      and source layout should be authored and verified; seeded random
      detail should not alter gameplay collision or strategic income.
    implementation_candidates: >-
      Default 64x64 tiles, 2 metres per tile, NW origin for planar map,
      sparse rectangles/polygons and ramp features, optional 16-bit
      lossless height raster and seeded decorative scatter. Final map
      size, spawn parity, exact route geometry and canopy visibility
      must be validated in the engine.
    specification: design/world-environments-and-map-authoring-2026-10-11.md
    format: design/map-authoring-format-v0.1.yaml
    first_map: design/mvp-verdant-divide-map.yaml
    acceptance_tests: design/mvp-man-eth-acceptance.yaml
  - id: DEC-028
    status: discussion_candidate_not_approved_for_MVP
    topic: optional_genuine_spherical_planetoid_world_topology
    resolution: >-
      The owner is considering a match/world flag selecting a true
      spherical planetoid instead of a classical flat rectangular RTS
      battlefield, and requested a pros/cons comparison. No owner
      confirmation to build spherical gameplay in the current MVP
      has been given. Recommend default PLANAR for the first MAN vs
      ETH jungle map and a versioned topology abstraction capable of
      future SPHERICAL surface geometry, radial gravity, geodesic
      navigation, tangent building placement, collision/LOS curvature
      and 360-degree circumplanetary movement.
    guardrails: >-
      A skybox-only rounded decoration, curved planar patch or
      toroidal 2D wrap is NOT a genuine sphere. An absent spherical
      runtime adapter must fail explicitly instead of pretending
      that a YAML flag implements planet physics. Sphere radius and
      eye-height can make the combat horizon very short; require
      engine performance, scale and camera tests before enablement.
    specification: design/planetary-map-topology-2026-10-11.md
    data_specification: design/world-topologies.yaml
  - id: DEC-029
    status: owner_approved_square_bounded_planar_MVP_with_floating_platform_environment_candidate
    topic: planar_rectangular_battlefield_boundary_and_flying_space_platform_framing
    resolution: >-
      The owner confirmed that the first MVP map can be a finite flat
      SQUARE/RECTANGULAR battlefield blocked by an invisible wall, rather
      than a true spherical planetoid. They also enthusiastically proposed
      framing potentially all maps as vast FLYING PLATFORMS IN SPACE,
      evoking classic space RTS decks, interplanetary Factorio-like
      platforms and an imaginative wandering mechanical airborne castle.
      Recommended reconciliation: the same PLANAR square tactical jungle
      battlefield is a huge stationary floating jungle habitat, bounded
      by a visible platform edge with a reliable invisible physics
      guard. The platform can have soil, natural tree cover, real pools
      and streams, resource rocks and an orbital sky backdrop without
      adding spherical navigation or flight.
    fixed_first_MVP: >-
      No units may cross the square bounds; default real ground physics,
      extraction, water and combat stay unchanged. The platform/backdrop
      is not a faction-owned building and never changes DEC-024 victory.
      No in-match whole-platform movement, space travel, vehicle flight,
      radial gravity, orbital weather physics or extra currency.
    open_visual_decisions: >-
      Floating space platform is the preferred first-map presentation
      candidate, not yet an explicit owner mandate to convert EVERY
      future map. A standard bounded planetary-surface rendering remains
      a legal presentation alternative on the same PLANAR topology.
      Campaign trips between planets, moving living castles and
      destructible mother-platforms require separate later scope.
    specification: design/floating-platform-battlefields-2026-10-11.md
    data_specification: design/battlefield-frames.yaml
    example_map: design/mvp-verdant-divide-map.yaml
  - id: DEC-030
    status: owner_approved_universal_world_rule_supersedes_DEC_029_optionality
    topic: every_playable_battlefield_is_floating_space_platform_regardless_of_surface_material
    resolution: >-
      EVERY Scalfagus playable map must be a finite independent FLYING
      PLATFORM in outer space. No classical playable planetary-surface
      maps exist as an alternate frame. Surfaces may be real brown
      earth with jungle trees, patchwork industrial metal, rock,
      desert, wetlands, ruins or mixed original terrain materials.
      The platform always has a visible rim and outer-space surroundings.
      For MVP its gameplay map is a bounded flat 64x64 candidate square
      with a hard invisible collision wall on all sides, uniform
      gravity, one traversable deck and no movement/falling beyond the
      edge. The underlying game-world topology is planar and all actors
      use the same authoritative world/physics across RTS, Direct and FPS.
      A distant planet is backdrop only, not the battlefield.
    implementation_required: >-
      Require battlefield_frame.variant=floating_space_platform in the
      map manifest for every playable level, and reject missing or
      bounded_planetary_surface variants. Separate immutable platform
      identity from variable surface material palette and the authored
      tactical colliders, liquid bodies, spawns and resource sources.
      The platform/rim is neutral world terrain, never an enemy
      victory-building. A floating platform is not a flying combat unit.
      No gameplay orbit physics, interplanetary travel, platform motion,
      ships/aircraft, drop-off death or multi-deck travel in MVP.
    supersedes: >-
      DEC-029's proposed optional floating-space-platform mode and
      remaining support for ordinary bounded planetary surface as a
      selectable playable map. Older discussions about genuine
      spherical planetoids remain archived research only, not an
      alternative to the universal flying platform doctrine.
    specification: design/space-platform-world-contract-2026-10-11.md
    frame_data: design/battlefield-frames.yaml
    surface_presets: design/platform-surface-presets.yaml
    example_map: design/mvp-verdant-divide-map.yaml
    map_format: design/map-authoring-format-v0.1.yaml
    coding_agent_plan: design/AGENT-MVP-IMPLEMENTATION.md
    acceptance: design/battlefield-frame-acceptance.yaml

  - id: DEC-031
    status: owner_approved_supersedes_prior_three_view_product_requirement
    topic: two_gameplay_perspectives_rts_overlord_and_first_person_possession_only
    resolution: >-
      Scalfagus exposes exactly TWO playable perspectives: F1 Overlord RTS
      for base building, logistics and army command, and F2 literal FPP/FPS
      Possession of an existing owned eligible unit. Third-person TPP,
      shoulder camera and overhead Direct Unit are NOT separate gameplay
      modes and should not receive independent polishing or controller
      mechanics. The current F1/F2/F3 spike may remain for debugging
      until it is safely migrated; the actual game input mapping has NOT
      yet been changed. F3 is unassigned/reserved for internal diagnostics.
      Esc while possessed returns safely to Overlord. RTS-only play
      must remain fully viable.
    invariants: >-
      One Godot authoritative world and one physical actor per unit across
      modes; input lease, legal aim and fire, health, economy and ability
      rules are shared; no second game simulation.
    supersedes: >-
      Earlier three-user-facing-camera scope across historical Hero,
      MVP and architecture documents; does not remove Hero presets,
      progressions or the Architect/Commander/Avatar playstyle disciplines.
    specification: design/overlord-fpp-possession-contract-2026-10-11.md
  - id: DEC-032
    status: owner_approved_architecture_implementation_pending
    topic: godot_native_headless_self_play_balance_lab
    resolution: >-
      Use Godot 4.7.2 with typed GDScript and ONE shared authoritative
      simulation core for both normal play and accelerated headless batches.
      Build bots following the same legal fog, resource and command rules;
      run paired-seed, side-swapped, strategy-varied matches to evaluate
      economy, military interactions, tactics and faction balance.
      LLMs may analyze summaries and propose parameter changes offline,
      never drive each simulation tick or auto-approve balance.
      ASCII is optional debug output, not a parallel text-game engine.
      Godot headless alone does not imply acceleration: implement
      unpaced deterministic fixed-tick match batching and profile it.
    mvp_scope_note: >-
      Current approved wider MVP remains MAN vs ETH (DEC-025).
      One-faction MAN mirror matches are a possible implementation
      stepping stone, but a one-faction playable-release scope was NOT
      approved in this decision. ORG is deferred until separately playable.
    specification: design/godot-headless-balance-lab-2026-10-11.md

  - id: DEC-033
    status: owner_approved_current_mvp_release_scope_supersedes_DEC_025_two_faction_first_release
    topic: micro_mvp_single_MAN_faction_two_player_RTS
    resolution: >-
      The FIRST playable Scalfagus MVP 0.1 is a classic Overlord-only
      RTS with exactly two player slots, both using the SAME MAN faction.
      Supported controller combinations are Human-Human, Human-Computer
      and Computer-Computer. Human-Human uses two Godot clients on LAN
      or loopback with one authoritative host; not hotseat or split screen.
      Computer-Computer can be watched live or run accelerated headless.
      The four required MAN templates are Command Core, MIN worker,
      Barracks and Rifleman, with finite SOLID->Matter worker cargo
      delivery, basic construction/production/combat and all-opponent-
      completed-buildings victory. Keep the mandatory flying-platform
      Verdant Divide map (DEC-030), one shared legal command API and
      reproducible fixed-tick Godot gameplay. This is the smallest
      shippable match, not the final faction-economy or camera feature set.
    exclusions: >-
      Playable ETH/ORG, MAN UMU modes and networks, Energy resource
      implementation, higher logistics layers, full hero progression,
      FPP possession and TPP are NOT required in MVP 0.1. FPP remains
      an approved later product direction under DEC-031. Existing
      working camera prototype/smoke may remain as debug baseline.
    supersedes: >-
      DEC-025 ONLY as regards the first playable MVP release requiring
      simultaneous MAN and ETH implementation and five roles per race.
      DEC-025's full two-faction slice remains a future milestone.
      Historical first MVP PR plans/delivery gates and three-camera
      acceptance criteria are superseded for MVP 0.1, not erased.
      DEC-001 Energy canon and other long-term faction mechanics stay
      approved for releases after MVP 0.1.
    specification: design/mvp0-man-mirror-rts-2026-10-11.md
    data_specification: design/mvp0-man-mirror-rts.yaml
    acceptance: design/mvp0-man-mirror-acceptance.yaml
    agent_backlog: design/mvp0-man-mirror-backlog.yaml

  - id: DEC-034
    status: owner_approved_engineering_policy_implementation_audits_pending
    topic: godot_native_reuse_first_and_audited_github_wrappers
    resolution: >-
      Every coding agent must first inspect existing Scalfagus components,
      then built-in Godot 4.7.2 APIs, then audited GitHub/AssetLib modules.
      Wrap existing engine/service functionality rather than reimplement
      generic pathfinding, raycasts, input handling, physics, UI layout,
      general state machines or network transports. Third-party sources
      require a reviewed license, immutable pinned commit, compatibility
      tests, provenance/security review and a replacement boundary.
      Authoritative game commands, fixed-tick orchestration, finite
      resource accounting, ownership/fog and victory remain Scalfagus
      domain code behind adapters; plugins cannot own those rules.
      Every PR records reuse evidence, actual test results and why
      original code was justified when reuse alternatives failed.
    current_release_scope: DEC-033_MAN_vs_MAN_Overlord_RTS
    specification: architecture/adr-0004-godot-reuse-first-wrappers.md
    module_registry: architecture/godot-third-party-candidates.yaml
    component_registry: architecture/godot-reuse-component-map.yaml
    agent_playbook: docs/AGENT-REUSE-FIRST-PLAYBOOK.md
    research: docs/GODOT-REUSE-RESEARCH-2026-10-11.md

  - id: DEC-035
    status: owner_approved_direction_exact_numeric_and_failure_semantics_TBD
    topic: three_faction_resource_transport_and_ETH_pylon_unit_relay
    resolution: >-
      MAN transports real resources in vehicles, transporters, finite depots and
      compatible bunker/UMU/power-station storage modes, and physical conveyor
      belts; its hybrid power/data cables never carry physical resource packets.
      ORG transports real resources in large living transport organisms and
      vulnerable finite living vascular veins. ETH transmits typed resources
      gradually pylon-to-pylon, with every pylon retaining finite actual local
      resource inventory; its ONE existing Ether Network additionally allows
      SLOW movement of eligible own units between connected pylons, unlike MAN
      conveyors and ORG veins. Unit-relay movement has real time, congestion,
      cost, vulnerability and unique-entity custody, NOT instant teleportation,
      free building relocation, unlimited safe deployment or cargo duplication.
      Numeric tuning, mode restrictions, safety and disruption handling remain
      unresolved. This is post-MVP0, not part of DEC-033 first MAN mirror release.
    specification: design/three-faction-logistics-and-eth-unit-relay-2026-10-11.md
    data_specification: design/three-faction-logistics-and-eth-unit-relay.yaml

  - id: DEC-036
    status: owner_approved_core_storage_identity_with_numeric_balance_pending
    topic: org_cyst_man_umu_specialization_and_eth_obelisk_storage_congestion
    resolution: >-
      ORG stores typed resources in cysts, each cyst dedicated to exactly
      one resource kind at a time. MAN Universal Man Unit (UMU) cargo may
      contain a mix, while explicitly specializing the same chassis for
      just one selected resource increases its effective cargo capacity.
      ETH mixed typed resources visibly levitate around each Obelisk and
      every Obelisk has real finite local inventory. Increasing inventory
      occupancy reduces that Obelisk's effective transit throughput.
      Players should therefore place storage Obelisks on branches/sidings
      and keep mainline relay Obelisks relatively lightly loaded. ETH
      background equalization must not force-fill designated transit
      nodes: DEC-036 supersedes the earlier unconditional network-wide
      equal-fill proposal. The approved player-facing name is Obelisk,
      not Pylon (to avoid StarCraft Protoss terminology); legacy code
      identifiers and historic documentation remain compatibility aliases
      until an explicitly tested migration. Exact storage capacities,
      throughput penalties, technical mode interactions and interruption
      behavior require tuning. All are post-MVP0, not part of DEC-033.
    specification: design/faction-storage-specialization-and-obelisk-traffic-2026-10-11.md
    data_specification: design/faction-storage-specialization-and-obelisk-traffic.yaml

  - id: DEC-037
    status: owner_approved_recovery_asymmetry_rates_thresholds_and_costs_TBD
    topic: org_living_HP_regen_eth_shield_HP_cycle_man_bio_medical_mechanical_service
    resolution: >-
      ORG biological HP regenerates automatically at a slow base rate
      and faster with actual valid connected living-vein access. ETH
      blue shields regenerate on their own and faster using a live
      connected Obelisk network. ETH can recover missing green HP by
      consuming its entire charged blue shield to heal a limited amount;
      a seriously wounded ETH actor requires several recharge-then-
      sacrifice cycles. The precise full-charge activation threshold,
      yield, timing and Energy/bandwidth costs are design/balance TBD.
      MAN biological units require external medical healing and
      mechanical units require service/repair for lost green HP.
      Certain MAN unit templates may have force shields, but MAN blue
      shield regeneration ALWAYS needs a finite local battery or valid
      powered MAN network; never passive recharge when isolated without
      energy. Health, shield and resource Energy remain distinct tracked
      quantities. This post-MVP direction does not add shields,
      medical or vein/Obelisk systems to DEC-033 MAN mirror MVP0.
    specification: design/faction-damage-recovery-shields-and-repair-2026-10-11.md
    data_specification: design/faction-damage-recovery-shields-and-repair.yaml

  - id: DEC-038
    status: approved_ETH_mono_storage_energy_and_ORG_ETH_bidirectional_direction_MAN_two_way_first_belts_proposed
    topic: faction_network_bidirectionality_and_homogeneous_storage_energy_economics
    resolution: >-
      ETH Obelisks can levitate mixed resource types but, for equal total
      levitated inventory, a more homogeneous store consumes less Energy
      per tick than a mixed store; cost remains positive and high storage
      occupancy still reduces transit throughput independently (DEC-036).
      ORG universal living vein links and ETH Obelisk network links allow
      real finite flows in both directions. The same material network
      capacity must be accounted for and not doubled for opposing flows.
      ORG cysts remain single-resource and biological specialization
      or mutation carries real commitment cost; reversibility and cost
      remain open. For early post-MVP MAN conveyor implementation, the
      owner proposed universal two-way belts requiring no player-set
      direction, with later optional Factorio-like one-way operation
      considered for advanced optimization. That belt default remains
      a proposed initial implementation rather than a finalized
      permanent requirement. No systems here enter DEC-033 MAN MVP0.
    specification: design/faction-bidirectional-logistics-and-homogeneous-storage-2026-10-12.md
    data_specification: design/faction-bidirectional-logistics-and-homogeneous-storage.yaml

  - id: DEC-039
    status: owner_selected_ETH_three_ingress_methods_ORG_Plug_Holes_preferred_candidate
    topic: ORG_universal_vein_docking_and_ETH_raw_material_ingress_methods
    resolution: >-
      For ORG, universal bidirectional Plug Holes are the recommended
      logistics ports for compatible MIN, MID and MAX transport workers,
      possibly complemented by specialist Mouth organs for feeding and
      digestion; owner has asked for comparison and not yet finally
      selected Plug Hole-only versus hybrid. DEC-011 early sequential
      handoffs, mode exclusivity and finite living vessel capacity remain.
      For ETH, the owner selects THREE ways to inject physical cargo into
      an elevated Ether Network: carry it physically to a Nexus with
      zero incremental upload Energy tariff (travel and finite port
      processing still cost time), have a shielded drone physically
      insert a finite batch at an Obelisk tip while losing 33 percent
      of its own blue shield, or enable the expensive Energy-consuming
      automatic pickup of real nearby ground stock by an Obelisk. The
      preferred initial interpretation is 33 percent of maximum shield
      per bounded transaction but its exact charge basis and packet
      size remain owner/balance TBD. Secondary non-Nexus ingress is now
      part of the future ETH direction and supersedes the older
      DEC-021 assumption that ONLY Nexus can admit raw physical cargo;
      Nexus conversion authority for blueprints, physical accounting,
      finite network services, levitation upkeep and resource identity
      preservation remain. This does not change MAN mirror MVP0.
    specification: design/org-plug-holes-and-eth-three-ingress-methods-2026-10-12.md
    data_specification: design/org-plug-holes-and-eth-three-ingress-methods.yaml

  - id: DEC-040
    status: owner_approved_UMU_two_wings_four_modes_exact_conveyor_lengths_balance_open
    topic: MAN_UMU_transforming_belt_wings_tracks_conveyor_bunker_and_sentry_wall
    resolution: >-
      Every MAN Universal Man Unit (UMU) has two attached conveyor-belt
      wings. When deployed as a conveyor they extend symmetrically by one
      or two tiles per side around a one-tile center, yielding exactly
      3 or 5 tiles of axial conveyor length. For ground travel both wings
      fold and rotate underneath the chassis to work as left and right
      crawler tracks. In BUNKER mode the wings fold against both sides
      of the body to provide side protection/garrison functionality
      where actually equipped. In the separate SENTRY WALL mode the
      wings rotate upright to form an actual physical barrier denying
      passage to ground units, not simply a turret variant and not
      a cosmetically impassable effect. The four mutually exclusive
      postures are MOVE/TRACKS, CONVEYOR (3 or 5), BUNKER, and
      SENTRY WALL. Transformation takes finite time and preserves
      one actor identity, actual cargo, legal deployment footprint,
      ownership and real navigation collision. Historical limits
      reserving the 3/5 belt solely for MID or denying a belt to an
      UMU Power Dock are superseded for units designated UMU; exact
      tier catalog, defensive parameters, wall width and energy
      details remain for playtesting. This is future work beyond
      DEC-033 MAN mirror MVP0.
    five_modes_open_cage_and_one_open_belt_refinement: >-
      Subsequent owner refinement: in MOVE, the same two conveyor
      wings bend underneath the vehicle as crawler tracks, creating
      a trapezoid-like profile around an open front/rear cargo or
      soldier passenger cage. The moving UMU can carry actual troops
      or actual finite freight. In a distinct WAREHOUSE posture, only
      ONE belt wing is extended as a local cargo loading/unloading
      port; the other remains folded. This is neither a two-sided
      3/5-tile through-CONVEYOR nor a BUNKER or SENTRY wall.
      Therefore the physical operational modes are now FIVE:
      MOVE, WAREHOUSE, CONVEYOR, BUNKER and SENTRY WALL.
      Exact passenger/cargo combination, troop fire permissions and
      single-belt loader extension remain open.
    specification: design/man-umu-transforming-belt-wings-2026-10-12.md
    data_specification: design/man-umu-transforming-belt-wings.yaml


