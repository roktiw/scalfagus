        atomic_shield_debit_and_HP_credit: true
        whole_shield_consumed_per_cycle: true
        charge_to_full_before_conversion: recommended_interpretation_not_numeric_canon
        actual_activation_threshold: owner_confirmation_or_balance_TBD
        regained_green_HP_per_cycle: finite_positive_TBD
        multiple_cycles_required_for_large_damage: true
        fully_depleted_shield_after_conversion: true
        healing_clamped_to_missing_HP: true
        no_unused_shield_to_global_energy_currency_conversion: true
        auto_activation_requires_explicit_delegate_permissions: true
        interrupted_network_does_not_instantly_finish_cycle: true
        actor_can_be_vulnerable_between_cycles: true
  man:
    biological:
      passive_green_HP_regeneration: false
      recovery: compatible_external_medical_treatment
      healing_provider_and_cost: TBD
    mechanical:
      passive_green_HP_regeneration: false
      recovery: compatible_service_or_repair
      real_Matter_parts_time_and_Energy_cost: TBD
    hybrid:
      category_specific_rules: TBD
    optional_force_shield:
      only_selected_templates: true
      passive_regeneration_without_power: false
      recharge_requires_power_source: true
      power_sources: [finite_local_battery, valid_powered_MAN_network]
      energy_consumption_finite_and_ledger_accounted: true
      empty_battery_and_no_powered_grid_means_zero_shield_recharge: true
      legal_battery_can_continue_when_grid_severed: true
      shield_to_HP_conversion_like_ETH: false
      exact_battery_capacity_grid_rate_and_cost: TBD
