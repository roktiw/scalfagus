  no_double_consumption_or_healing: true
  same_game_state_GUI_LAN_headless: true
factions:
  org:
    default_shields: false
    health:
      baseline_passive_regeneration: true
      baseline_rate: positive_slow_TBD
      requires_external_healer_for_baseline: false
      valid_live_vein_connection:
        effect: faster_green_HP_regeneration
        network_must_be_live_accessible_and_eligible: true
        boosted_rate_gt_baseline_under_same_conditions: true
        accelerated_service_real_nourishment_cost: TBD
      cut_vein:
        boosted_regeneration: disabled_or_bounded_buffer_if_later_approved
        baseline_regeneration_can_continue_if_unit_is_still_viable: true
        obey_existing_branch_starvation_withering: true
  eth:
    canonical_network_node_player_facing_name: Obelisk
    shields:
      present_for_eligible_templates: true
      natural_regeneration_without_network: true
      passive_rate: positive_TBD
      delay_after_recent_damage: TBD
      connected_Obelisk_network:
        effect: faster_blue_shield_regeneration
