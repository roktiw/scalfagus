        boost_gt_baseline_under_same_conditions: true
        real_network_energy_and_bandwidth_cost: TBD
        storage_pressure_compatibility: DEC-036
      network_cut:
        fallback_to_passive_regeneration: true
        previously_earned_charge_preserved: true
    green_health:
      natural_autoregen_without_shield_conversion: not_approved
      recovery_method: sacrifice_whole_recharged_shield_to_restore_finite_HP
