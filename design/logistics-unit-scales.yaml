schema_version: 1
project: scalfagus
version: 0.4
status: owner_approved_economic_roles_with_open_balance
specification: design/logistics-min-mid-max-2026-10-11.md
base_ecology_specification: design/base-ecologies-and-expansion-2026-10-11.md
scope: economic_logistics_platforms_only
resource_ids: [matter, volatiles, energy]
scale_meaning: chassis_scale_not_technology_or_match_scale
paradigms:
  org: mobile_hunter_gatherers
  man: physical_conveyor_and_fortification
  eth: courier_relay_and_late_game_defense
shared:
  min_can_extract_independently: true
  min_can_deliver_directly: true
  mid_has_multiple_finite_cargo_slots: true
  economic_mid_can_extract_if_equipped: true
  max_movement_is_faction_specific: true
  transport_is_physical_no_free_teleport: true
  source_destination_slot_reservations: true
  finite_cargo_and_passenger_capacity: true
  no_cargo_duplication: true
  player_orders_authoritative: true
  mode_transition_explicit: true
  generic_workers_cannot_deploy: true
  strategic_automation_requires_permission: true
  combat_and_logistics_compete_for_capacity_or_time: true
factions:
  org:
    name_mid: Organites
    gathering_style: hunter_gatherer
    economic_gradient:
      size_min_mid_max: increasing
      cargo_slots_min_mid_max: increasing
      cargo_capacity_min_mid_max: increasing
      personal_extraction_speed_min_mid_max: decreasing
      movement_speed_min_mid_max: decreasing
    min:
      role: fast_independent_worker
      movement_domains: [land]
      can_extract: true
      direct_base_delivery: true
      cargo_slots: few
      combat: proposed_basic_equipped_self_defense
      construction:
        permitted_level: l1
        requires_growth_organs_and_connected_live_vessel: true
    mid:
      role: medium_biological_harvester
      movement_domains: [land]
      can_extract: true
      cargo_slots: several
      can_receive_min_cargo: true
      can_load_flying_mother: true
      initial_handoff_limits:
        items_per_completed_worker_handoff: 1
        concurrent_worker_handoffs_to_or_from_this_mid: 1
        unloading_or_loading_requires_sequential_service: true
        throughput_upgrade_required_for_multiple_simultaneous_handoffs: true
      passengers: proposed_limited_min_capacity
      optional_combat: proposed_with_transport_tradeoff
      construction:
        permitted_level: l2
        requires_growth_organs_and_connected_live_vessel: true
    max:
      role: flying_mother_transporter
      movement_domains: [air]
      mobile: true
      cargo_slots: many
      flight_loop: deposit_pickup_base_unload_return
      can_receive_in_motion: technology_gated_midgame_not_initial
      can_unload_in_motion: technology_gated_midgame_not_initial
      finite_transfer_range_and_rate: true
      initial_transfer_limits:
        items_per_completed_worker_handoff: 1
        concurrent_worker_handoffs_to_or_from_this_max: 1
        transfer_ports: 1
        receiving_and_dispatching_simultaneously: false
        simultaneous_moving_and_transfer: false
        simultaneous_harvest_and_other_activity: false
      initial_operating_modes:
        - move
        - receive
        - dispatch
        - extract
      initial_mode_exclusivity: exactly_one_active_mode
      route_behavior_without_upgrades: travel_then_stop_and_receive_then_travel_then_stop_and_dispatch
      extract_mode_requires_eligible_extraction_organs: true
      midgame_upgrade_proposal:
        unlocks: [moving_while_receiving, moving_while_dispatching]
        single_item_per_handoff_remains: true
        max_simultaneous_handoffs: 1
        receiving_and_dispatching_simultaneously: false
      lategame_upgrade_proposal:
        unlocks: [additional_transfer_ports, concurrent_inbound_outbound_subject_to_bandwidth]
        transfer_port_count: TBD
        aggregate_transfer_rate_and_mass_budget: finite
        extracting_while_other_activities: separately_gated_not_default
      passengers: proposed_min_mid_or_soldiers_with_manifest
      optional_combat: proposed_with_mass_and_payload_tradeoff
      own_extraction: proposed_slow_specialist
      signature_weakness: intercept_loaded_mother
      construction:
        permitted_level: l3
        requires_growth_organs_and_connected_live_vessel: true
    mode_design:
      required_default: [harvest_and_carry, exclusive_move_receive_dispatch_extract_modes, stop_to_load_unload]
      proposed_unlocks: [midgame_moving_handoffs, lategame_parallel_transfer_ports]
      note: Cargo loops are route orders; uninterrupted moving handoffs are unlocked, not baseline.
      proposed: [passenger_transport, escorted_defensive_carrier]
      mutation_reversible: false
  man:
    name_mid: Manusians
    gathering_style: physical_conveyor_network
    nexus_model: composable_relocatable_modular_base
    independent_unlinked_expansions: true
    home_communication_required_for_outpost: false
    extensive_unit_and_building_repair: true
    min:
      role: self_sufficient_ground_miner_and_manual_hauler
      movement_domains: [land]
      can_extract: true
      direct_base_delivery: true
      cargo_slots: few
      build_prefabs_and_repair_eligible_units_structures: true
      repairs_need_spare_materials_time_and_tools: true
    mid:
      role: mobile_conveyor_segment
      movement_domains: [land]
      belt_length_tiles_options: [3, 5]
      cargo_slots: several_buffer_compartments
      can_extract_if_equipped: true
      tracked_ground_chassis: true
      mode_changes_are_mutually_exclusive: true
      modes:
        conveyor:
          finite_rate: true
          physically_connected: true
          movable_repositioning_disrupts_connection: true
        sentry_wall:
          mode_capability_required: true
          conveyor_flow: disabled
          must_eject_resource_packages_behind_wall: true
          protected_side_uses_explicit_facing: true
          ejection_requires_legal_space_or_receiver: true
          package_is_world_inventory_not_base_credit: true
          garrison_slots: 0
        one_soldier_bunker:
          mode_capability_required: true
          conveyor_flow: disabled
          garrison_slots: 1
          unfolds_as_small_defensive_post: true
          construction_or_unpack_time_required: true
      reversible_wall_to_belt: proposed_costed
      signature_weakness: belt_cut_or_defensive_conversion
    max:
      role: ground_mobile_depot_warehouse
      movement_domains: [land]
      mobility: very_slow_ground_only
      can_fly: false
      cargo_slots: many
      modes:
        depot:
          receive_and_dispatch_cargo: true
          ground_movement: very_slow
        bunker:
          specialized_deployable_tag_required: true
          resource_packages_ejected_before_conversion: true
          ejection_requires_real_space_or_depot: true
          receives_and_dispatches_cargo: false
          can_garrison_soldiers: true
          soldier_slots: finite_TBD
      bunker_to_depot: proposed_costed
      signature_weakness: isolated_depot_or_critical_belt
      nexus_model: warehouse_or_bunker_is_one_module_not_the_entire_base
  eth:
    name_mid: Etherans
    gathering_style: mobile_min_couriers_to_fixed_pylon_relay_and_nexus_cores
    base_model: distributed_resonance_network
    initial_home_contact_for_new_expansion: true
    continuous_home_contact_for_operating_expansion: false
    unknown_blueprints_need_home_contact: true
    min:
      role: independent_extractor_courier_and_network_builder
      movement_domains: [land]
      can_extract: true
      direct_base_delivery: true
      cargo_slots: few
      construction:
        mode: network
        worker_remains_at_build_site_until_finished_or_cancelled: true
        blue_beam_visible_as_strategic_signal: true
        beam_target: nearest_eligible_large_node
        spends_real_stored_energy: true
        matter_and_volatiles_physically_delivered: true
        beam_visibility_vs_fog_of_war: TBD
        mode_excludes_extraction_and_courier_work: true
    mid:
      status: owner_approved_role_numeric_balance_tbd
      role: pylon_cargo_storage_relay_or_turret
      mobile_while_operating: false
      movement_domains: []
      cargo_slots: several
      handoffs_require_range_queue_and_slot_capacity: true
      modes:
        storage_relay:
          accepts_cargo: true
          dispatches_cargo: true
          turret_enabled: false
        meditating_to_turret:
          duration: positive_TBD
          cargo_remains_inside: true
          accepts_cargo: false
          dispatches_cargo: false
          turret_enabled: false
        turret:
          cargo_remains_inside: true
          accepts_cargo: false
          dispatches_cargo: false
          turret_enabled: true
          finite_weapon_cost_or_cooldown: TBD
        meditating_to_storage:
          duration: positive_TBD
          cargo_remains_inside: true
          accepts_cargo: false
          dispatches_cargo: false
          turret_enabled: false
      future_levitating_relocation: only_if_explicitly_equipped_and_meditated
      signature_weakness: node_disruption_and_logistics_downtime
    max:
      status: owner_approved_role_numeric_balance_tbd
      role: nexus_class_core_node
      mobile_while_operating: false
      movement_domains: []
      acts_as_nexus_from_creation: true
      cargo_slots: many
      large_node: true
      local_blueprint_cache: true
      initial_expansion_contact_to_home: true
      known_buildings_work_offline_after_initialization: true
      receives_network_construction_beams: true
      major_storage_and_routing: true
      not_default_mid_pylon_turret: true
      eligible_structure_can_levitate_after_meditation: proposed_template_specific
      no_free_teleport: true
      signature_weakness: knowledge_and_high_value_core_loss

mode_rules:
  resource_ejection_creates_finite_world_packages: true
  resource_ejection_does_not_credit_base: true
  ejection_requires_legal_destination: true
  no_legal_ejection_target: block_or_queue_mode_change
  pylon_meditation_preserves_all_cargo: true
  reservations_settled_before_mode_gate_locks: true
  passenger_manifests_have_finite_capacity: true
  generic_max_without_deployable_tag_cannot_transform: true
  eth_pylon_defensive_modes_belong_to_mid: true
  eth_max_nexus_role_supersedes_old_max_turret_pylon: true
  man_mid_bunker_slots_exact: 1
balance_status: TBD_after_playtests
