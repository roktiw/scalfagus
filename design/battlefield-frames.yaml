  surface: [actual_jungle_trees, soil, rocks, ponds, streams]
  no_requirements_to_copy_third_party_IP: true
  respect_pixel_art_unit_legibility: true
implementation:
  render_frame_separately_from_map_logic: true
  map_manifest_field: battlefield_frame
  planar_world_grid_remains_authoritative: true
  guard_colliders_match_ground_edges: true
  collider_high_enough_to_block_normal_Hero_and_UMU: true
  map_edge_is_artful_but_gameplay_is_impenetrable: true
  background_motion_visual_only_does_not_change_world_origin: true
  unsupported_spherical_topology_rejected: true
future_not_in_mvp:
  platform_can_travel_between_planets: potential_campaign_mechanic
  platform_is_a_destructible_command_ship: design_later
  asteroid_interception: deferred
  deck_construction_expansion: deferred
  multiple_walkable_decks: deferred
  engine_fuel_management: deferred
  entering_leaving_platform_with_flyers: deferred
  water_and_air_units: deferred
acceptance_test_ids: [FRAME-01, FRAME-02, FRAME-03, FRAME-04, FRAME-05, FRAME-06, FRAME-07, FRAME-08, FRAME-09, FRAME-10]
