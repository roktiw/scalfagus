schema_version: 1
project: scalfagus
version: 0.1
status: owner_approved_bounded_square_mvp_with_floating_platform_presentation_candidate
owner_decision: DEC-029
documentation: design/floating-platform-battlefields-2026-10-11.md
not_world_topology: true
world_topology_in_mvp: planar
same_map_collider_navigation_and_resource_ledger_for_all_frames: true
battlefield_frame_variants:
  bounded_planetary_surface:
    description: standard_square_ground_patch_at_world_surface
    boundary_mode: invisible_hard_wall
    visible_rim: optional_natural_rock_edge
    biome_independent: true
    topological_wraparound: false
  floating_space_platform:
    description: rectangular_level_surface_on_huge_stationary_floating_world_ship_in_space
    boundary_mode: solid_edge_with_invisible_collision_guard
    visible_rim: required
    underside_geometry: noninteractive_render_only
    biome_independent: true
    can_contain_earthlike_soil_trees_rivers_and_water: true
    background_options: [starfield, distant_planet, clouds, nebula]
    atmospheric_retention: lore_only_in_mvp
    global_radial_gravity: false
    local_uniform_gravity: true
    actual_ship_motion_during_match: false
    cosmetic_background_parallax_only: true
    interplanetary_travel: not_in_mvp
default_candidate:
  battlefield_frame: floating_space_platform
  specific_map_id: verdant_divide
  flavor: earthlike_hanging_jungle_habitat_on_ancient_mobile_platform
  only_single_playable_ground_deck: true
  no_faction_bonus_from_platform_silhouette: true
  fixed_tree_trunk_cover: true
  nonharvestable_freshwater_on_deck: true
  harvestable_world_forms: [solid]
  next_platform_family_candidates: [orbital_foundry, aerial_monastery, drowned_ark]
  universal_platform_mandate_for_all_future_maps: owner_confirmation_needed
  previous_planar_non_platform_presentation_remains_legal: true
boundary:
  outer_bounds_come_from_world_planar_grid: true
  square_mvp_candidate: {width_tiles: 64, height_tiles: 64}
  collision_policy: impassable
  unit_fall_off_edges_mvp: false
  long_range_escape_through_wall: false
  pathfinder_treats_border_as_blocked: true
  world_colliders_in_RTS_Direct_and_FPS: identical
  projectiles_do_not_enter_gameplay_space_beyond_boundary: true
  fog_of_war_not_extended_into_starfield: true
  cannot_place_buildings_outside_bounds: true
  loot_scatter_clamps_to_valid_inside_cells_deterministically: true
  faction_neutral_platform_is_not_victory_building: true
  background_not_interactable: true
  source_positions_and_terrain_geometry_unaffected_by_backdrop: true
  no_out_of_bounds_teleportation_by_mobile_UMU: true
  floating_ETH_pylon_repositioning_remains_post_mvp: true
mvp_asset_families:
  rim: [aged_metal_terrace, soil_retaining_wall, suspended_roots]
