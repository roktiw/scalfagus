schema_version: 1
project: scalfagus
version: 0.2
status: owner_approved_universal_floating_space_platform_all_playable_maps
owner_decision: DEC-030
previous_decision_superseded_in_framing: DEC-029
documentation: design/space-platform-world-contract-2026-10-11.md
world_topology_in_mvp: planar
platform_identity_and_surface_biome_are_independent: true
required_frame_for_all_playable_maps: floating_space_platform
validation:
  variant_required_in_every_playable_map: true
  allowed_playable_variants: [floating_space_platform]
  missing_frame_fails_compile: true
  bounded_planetary_surface_as_playable_variant: forbidden
  unspecified_planet_surface_fallback: forbidden
  other_unknown_frame_variants: fail_validation
  debug_scene_without_art_allowed_only_when_not_selectable_or_playable_map: true
  map_frame_never_alters_economy_los_nav_victory_or_map_balance_implicitly: true
  phase: map_compile_before_runtime
  reject_unimplemented_spherical_gameplay: true
floating_space_platform:
  required: true
  description: isolated_floating_tactical_world_deck_above_space_with_finite_terrain
  is_world_and_level_frame_not_faction_built_structure: true
  platform_is_neutral_not_victory_building: true
  upper_surface:
    requires_ground_with_height_ramps_and_buildable_area: true
    material_source: design/platform-surface-presets.yaml
    supports_mixed_material_regions: true
    living_soil_and_jungle_allowed: true
    industrial_patchwork_metal_allowed: true
    rock_desert_wetland_ruins_and_other_terrains_allowed: true
    may_include_visual_and_nonharvestable_liquid_bodies: true
  edge:
    four_sided_for_first_square_map: true
    boundary_policy: impassable
    visible_rim_required: true
    invisible_physics_guard_required: true
    guards_present_in_RTS_Direct_and_FPS: true
    prevent_actor_fall_off_in_first_mvp: true
    prevent_building_and_loot_spawns_out_of_bounds: true
    projectile_clip_or_legal_collision_at_boundary: true
    no_map_wraparound: true
  external_scene:
    is_noninteractive: true
    renders: [platform_underside, distant_stars, distant_planet_or_nebula]
    has_gameplay_navmesh: false
    has_harvestable_resource: false
    can_be_selected_or_attacked: false
    can_count_as_building: false
  static_gameplay_frame:
    platform_translational_motion_during_match: none
    platform_rotational_motion_during_match: none
    gravity: uniform_in_mvp
    true_sphere_terrain: false
    travel_between_planets: post_mvp_research
    cosmetic_space_background_parallax_without_sim_movement: allowed
default_mvp:
  map_id: verdant_divide
  variant: floating_space_platform
  surface_preset: brown_soil_jungle
  surface_heightfield: planar_64_x_64_candidate
  deck_appearance: suspended_earthlike_jungle_habitat
  surface_source_forms_collectible: [solid]
  liquid_bodies_present_but_noncollectible: true
  actual_player_unit_domains: [ground]
  tree_trunks_are_gameplay_cover: true
  backdrop_candidate: distant_planet_below_low_contrast_stars
  visible_rim_candidate: brown_earth_roots_and_exposed_structural_braces
  no_hero_drop_death_at_edge: true
future_material_family_examples: [brown_soil_jungle, industrial_metal_patchwork, rocky_desert, resonant_monastery, wet_biological_ark]
no_first_mvp_support_for:
  - ordinary_planetary_surface_playable_maps
  - orbital_ship_motion_during_battle
  - interplanetary_travel
  - multi_deck_movement
  - floating_platform_damage_as_match_objective
  - space_walk_or_flight
  - true_spherical_gameplay_nav_and_gravity
  - harvested_liquid_or_gas_resources
owner_locked:
  all_future_playable_maps_are_floating_platforms: true
  upper_surface_biome_and_material_are_variable: true
  space_is_surrounding_scene_not_playable_first_mvp_domain: true
  initial_world_flat_square_and_bounded: true
  lower_surface_art_never_counts_as_playable_world: true
acceptance_tests:
  primary: design/battlefield-frame-acceptance.yaml
  MVP_implementation: design/mvp-man-eth-acceptance.yaml
