schema_version: 1
project: scalfagus
version: 0.6
status: approved_core_rules_with_proposed_details
resource:
  id: energy
  tier: 3
  inventory_resource: true
  units: abstract_energy_units
  stored: true
  transported: true
  spent: true
  not_a_mandatory_power_grid: true
  note: >-
    This means the universal Energy currency requires no mandatory global
    power grid. The MAN faction may use local finite wired electricity.
  network_contract: design/three-faction-network-and-infrastructure-contract-2026-10-11.md
  man_power_dock:
    actual_generated_energy_is_finite_and_accounted: true
    support_pu_is_rate_not_new_stored_currency: true
    local_auto_electric_connectors: proposed
    battery_supports_detached_units_for_finite_time: true
    no_electric_cable_transport_for_solids_liquids_gases: true
  eth_ether_representation:
    underlying_energy_currency_id_remains_energy: true
    nexus_conversion_into_ether_form_changes_representation_not_resource_type: true
    network_transit_bounded_by_finite_node_link_capacity: true
  physical_deposit_form_is_not_energy_resource: true
  gas_deposit_is_not_directly_equal_to_energy: true
  source_form_mapping_reference: design/physical-resource-forms.yaml
  gas_capture_to_energy_conversion_recipe: TBD_optional
  supply:
    generation: [geothermal, solar_collection, reactors]
    harvesting: [energy_deposits]
    inputs_and_output_rates: TBD
    generation_requires_installation: true
  terrain:
    lava: {universal: false, role: geothermal_heat_source, fourth_resource: false}
  storage:
    capacity_limited: true
    faction_containers:
      org: biological_reservoirs
      man: batteries_and_cartridges
      eth: resonant_matrices_and_typed_ether_node_inventory
      former_blergians_manusians_aetherians: migrated_out_of_active_keys
  transport:
    physical_cargo: true
    compatible_with_min_mid_max_logistics: true
    throughput_and_capacity: TBD
  expenditure: [technology, modules, transformations, abilities, advanced_production]
  conversion:
    recipes_explicit: true
    free_unrestricted_conversion: false
    input_cost_and_loss: TBD
  ongoing_upkeep:
    globally_required: false
    specific_units_or_abilities: proposed
  loss_and_capture:
    cargo_destruction_behavior: TBD
    storage_capture_behavior: TBD
  anti_softlock:
    starter_energy_required_for_basic_matter_extraction: false
    guaranteed_path_to_first_energy_producer: true
    first_gas_extractor_recipe_must_not_need_its_uncaptured_gas_output: true
    basic_solid_collection_available_without_energy_extraction_rig: true
balance:
  energy_per_minute: TBD
  storage_capacities: TBD
  unit_and_transformation_costs: TBD
  compare_across_factions: true
migration:
  replaces_legacy: resin
  note: Not a one-to-one numerical conversion; update older YAML definitions separately.
