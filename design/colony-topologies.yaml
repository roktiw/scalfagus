      builder_network_mode_required: true
      visible_blue_energy_beam_to_eligible_larger_node: true
      beam_active_during_finite_construction_job: true
      beam_is_not_protoss_orb_drop_and_fly_away: true
      line_of_sight_visibility_balance: TBD
      resource_and_build_time_costs_apply: true
      no_unbounded_or_unfunded_remote_wallet_access: true
      typed_ether_after_nexus_conversion_has_finite_network_transfer: true
    transport:
      model: physical_couriers_to_nexus_then_typed_ether_freight_across_pylons
      pylon_and_obelisk_one_template: true
      node_balances_reconcile_deterministically_on_split: true
      even_resource_distribution_is_finite_proportional_fill: proposed
      mobile_min_couriers: true
      physical_cargo_and_finite_node_buffers: true
      mid:
        kind: pylon_obelisk_one_mid_template
        local_resonance_supply_cap_contributor: true
        signal_and_knowledge_relay: true
        conversion_requires_nexus_input_before_network_stock: true
        freight_closed_in_turret_while_signal_stays_online: proposed
        modes: [storage, network_relay, meditating, turret, levitating_move]
        storage_relay_turret_capabilities: true
        moving_requires_specialized_capability: true
        movement_requires_meditation_duration: true
        cargo_preserved_during_meditation: true
        cargo_gates_locked_during_meditation: true
        active_turret_cargo_gates_locked: proposed_pending_balance
        construction_beam_can_terminate_here_when_eligible: true
      max:
        kind: nexus_class_from_first_deployment
        nexus_role_immediate: true
        local_pattern_store_and_authority: true
        physical_intake_and_resource_to_typed_ether_conversion: true
        local_ether_inventory_and_network_synchronization: true
        can_seed_local_expansion: true
        initial_synchronization_from_existing_node: true
        no_mandatory_home_link_after_bootstrap_for_known_patterns: true
