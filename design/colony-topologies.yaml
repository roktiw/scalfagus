factions:
  org:
    name_mid: Organites
    primary_spatial_form: vascular_connected_budding_body
    base_mobility_rank: lowest_of_three
    main_nexus: rooted_structural_and_nourishment_origin
    structure_budding:
      requires_actual_live_vascular_path: true
      grow_conduit_to_destination_first: true
      visually_traceable_branch: true
      biomass_creep_carpet_as_default: false
      construction_levels:
        min: [level_1, conduit]
        mid: [level_2, conduit_support]
        max: [level_3_support_when_equipped]
    network:
      kind: vascular_mycelial
      edges_targetable: true
      edges_can_be_damaged_repaired_and_regrown: true
      connection_transports_structural_nourishment: true
      instant_shared_global_inventory: false
      throughput: finite_TBD
      branch_states: [growing, connected, isolated_buffered, starving, dormant, withered]
      state_transitions: proposed_to_balance
      branch_local_reserves: finite
      cut_link_does_not_instant_destroy_every_building: true
      cut_link_does_not_disable_individual_unit_ai: true
      starvation_has_telegraphing: true
    expansion:
      home_dependency: continuous_live_vascular_link_AND_recurring_home_origin_supply
      continuous_live_vascular_path_to_home_required: true
      recurring_actual_home_origin_nourishment_deliveries: true
      local_extraction_does_not_remove_home_delivery_requirement: true
      living_vascular_path_alone_does_not_satisfy_nourishment_delivery: true
      home_origin_supply_alone_does_not_substitute_for_broken_vascular_path: true
      permanent_fully_independent_expansion: false_by_default
      physical_worker_feeding: true
      worker_feeding_costed_from_real_inventory: true
      feeding_can_temporarily_extend_finite_local_reserve: true
      delivery_must_be_from_home_origin: true
      unlimited_autonomous_self_nourishment: not_approved
    transport:
      model: living_loops
      min: fast_independent_gatherer_and_branch_tender
      mid: slower_armored_harvester_and_temporary_supply_reservoir
      max: flying_mother_transporter_and_high_level_growth_support
      max_preferred_route: cyclic_source_to_colony_nourishment_delivery
      moving_handoff_starting_tech: false
      early_handoff: stop_and_one_worker_one_item_at_a_time
      moving_handoff_upgrade: researched_midgame
      additional_ports_upgrade: researched_lategame
      preexisting_decision: DEC-011
    strategic_weaknesses: [severed_vascular_artery, starvation, flying_mother_ambush]
    proposed_recovery: [repair_vessel_with_min, worker_feeding, fallback_small_carrier]
  man:
    name_mid: Manusians
    primary_spatial_form: modular_mobile_independent_islands
    base_mobility_rank: highest_of_three
    nexus_definition: assembly_of_specialized_modules_and_units
    independent_expansion_requires_home_ping: false
    independent_outpost_minimum:
      must_have_actual_sources_and_storage: true
      must_obey_resources_and_build_costs: true
      can_operate_without_parent_communications: true
      invisible_without_enemy_scouting_only_due_to_normal_fog: true
    construction:
      mobile_buildings_are_capability_tagged: true
      walking_and_tracked_structures_allowed: true
      deployed_footprints_terrain_and_collision_checked: true
      not_every_generic_unit_may_deploy_into_a_building: true
      upward_and_radial_growth_visualized: true
      structures_can_split_and_reassemble: true
    power_dock_and_grid:
      ground_mobile_basic_generator_warehouse_or_bunker: true
      generator_deployed_only: true
      local_auto_power_ports_and_finite_battery: proposed
      cable_links_carry_power_not_materials: true
      worker_finite_physical_material_fetch_from_source_transporter_or_depot: true
      no_mandatory_home_grid_connection: true
      small_power_dock_does_not_replace_mid_belt_or_max_depot: true
    transport:
      model: modular_physical_conveyors
      min: scv_like_worker_builder_repairer_hauler
