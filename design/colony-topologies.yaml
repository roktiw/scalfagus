        belt_lengths_cells: [3, 5]
        one_person_bunker_capability: true
        modes: [move, conveyor, one_person_bunker, sentry_wall]
        all_modes_full_output_simultaneously: false
        sentry_wall_uses_explicit_protected_facing: true
        sentry_wall_ejects_cargo_behind_to_legal_cells: true
        cargo_ejection_not_instant_resource_credit: true
        bunker_and_wall_mode_simultaneity: unresolved
      max:
        kind: slow_ground_mobile_depot_bunker
        can_fly: false
        modes: [mobile_depot, deployed_depot, soldier_bunker]
        finite_soldier_garrison_slots: true
        cargo_ejected_to_legal_inventory_before_bunker: true
        military_and_logistics_throughput_tradeoff: true
    strategic_weaknesses: [splitter_interdiction, exposed_belts, isolated_base_raids]
