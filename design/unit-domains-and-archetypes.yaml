# Scalfagus unit taxonomy — DESIGN PROPOSAL, not a runtime contract.
# 7 archetypes x 3 chassis scales x 3 factions = 63 named templates.
# MIN/MID/MAX chassis size is independent of match_scale MIN/MID/MAX.
schema_version: '0.1-draft'
status: proposed
chassis_scales: [min, mid, max]
domains: [land, water, air]
domain_combinations:
  ground: [land]
  aquatic: [water]
  aerial: [air]
  amphibious: [land, water]
  air_ground: [land, air]
  air_water: [water, air]
  omnimodal: [land, water, air]
combat_rules:
  movement_domains: 'Traversable domains, not guaranteed attack targets'
  melee_targets: 'Target domains reachable in close combat'
  ranged_targets: 'Target domains addressable by installed weapons'
  empty_targets: 'No attack capability of that kind'
  target_domain_is_not_accuracy: true
  future_extensions: [water_surface, submerged, altitude, orbital]
archetypes:
  worker:
    description: 'Extraction, hauling, construction and repair, subject to equipment.'
  fighter:
    description: 'Basic close-combat line unit.'
  shooter:
    description: 'Basic direct ranged damage.'
  artillery:
    description: 'Long-range siege and area denial.'
  tank:
    description: 'Durability, screening and frontline breakthrough; a role, not chassis size.'
  flyer:
    description: 'Air-oriented scouting, mobility or combat; not the only role permitted to fly.'
  specialist:
    description: 'Faction-specific utility, support, disruption or control.'
