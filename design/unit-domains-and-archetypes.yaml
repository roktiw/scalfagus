balance_principles:
  - 'Additional movement domains must trade off cost, capacity, mobility or vulnerability.'
  - 'Anti-air targeting requires a compatible weapon or ability, not merely air movement.'
  - 'Artillery trades damage/range for reload, minimum range, vulnerability or cost.'
  - 'Tank archetype trades protection for mobility or economic burden.'
  - 'Omnimodal variants must be costly or deliberately weak in specialization.'
  - 'All factions retain counterplay across land, water and air.'
  - 'Chassis scale never directly grants combat domains or tech tier.'
prototype:
  first_slice: '7 min-chassis archetypes per faction, 21 templates total'
  full_design_catalog: 63
  validate: [domain_pathing, legal_targeting, anti_air_counterplay, amphibious_transitions, faction_distinctiveness, ai_orders, replay]
