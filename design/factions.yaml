# Scalfagus original faction definitions
schema_version: 1
project: scalfagus
status: concept # gameplay mechanics remain conceptual; naming fields are owner-approved
description: >-
  Three original playable science-fiction factions inspired by broad RTS
  archetypes and the five-color philosophy of Magic: The Gathering.
  Names, lore, art and units should be developed as independent IP.
factions:
  - id: org
    name: Organs
    name_short: Organs
    name_mid: Organites
    name_full: Organites Reproductive Generalismus
    name_initialism: ORG
    archetype: specialized_biological_civilization
    mtg:
      colors: [black, red, green]
      shorthand: BRG
      combination: Jund
    themes:
      - consumption
      - aggression
      - mutation
      - adaptation
      - biological_evolution
    aesthetics:
      - organic_architecture
      - asymmetric_creatures
      - living_structures
    gameplay_direction:
      - evolving_biological_units
      - rapid_aggressive_expansion
      - continuous_multi_lane_pressure
      - concentrated_biomass_connected_bases
    lore: >-
      A predatory civilization of adaptive organisms whose living
      infrastructure evolves through competition and resource consumption.
  - id: man
    name: Manus
    name_short: Manus
    name_mid: Manusians
    name_full: Manusians Augmented Navigators
    name_initialism: MAN
    archetype: industrial_colonists
    mtg:
      colors: [red, white, blue]
      shorthand: RWU
      combination: Jeskai
    themes:
      - ingenuity
      - discipline
      - freedom
      - military_technology
      - tactics
    aesthetics:
      - industrial_colonies
      - modular_vehicles
      - fortified_outposts
    gameplay_direction:
      - combined_arms
      - tactical_flexibility
      - dispersed_modular_outposts
      - intelligence_driven_specialized_strike_groups
    lore: >-
      A civilization of inventive colonists balancing individual freedom,
      coordinated defense and experimental engineering.
  - id: eth
    name: Eters
    name_short: Eters
    name_mid: Etherans
    name_full: Etherans Transcendent Hypervisors
    name_initialism: ETH
    archetype: ancient_energy_civilization
    mtg:
      colors: [white, blue, green]
      shorthand: WUG
      combination: Bant
    themes:
      - harmony
      - knowledge
      - transcendence
      - symbiosis
      - advanced_technology
    aesthetics:
      - crystalline_structures
      - energy_fields
      - living_technology
    gameplay_direction:
      - energy_manipulation
      - high_value_specialist_units
      - fortified_homeworld_reconstruction
      - preserve_core_base_until_late_game
    lore: >-
      An ancient civilization that unites scientific insight with
      ecological symbiosis and technologies based on resonance and energy.
legal_notes:
  - These are original working names; trademark clearance has not been performed.
  - MTG color combinations are design references, not an affiliation with Wizards of the Coast.
  - Do not redistribute Blizzard or Wizards of the Coast copyrighted artwork or lore.
  - Create independent silhouettes, symbols, names and gameplay identities.

default_playstyles:
  note: >-
    Default strategic identities, not exclusive faction restrictions.
    Skilled players may pursue rush, expansion, turtle, harassment,
    attrition, or tech strategies with any faction.
  org:
    default_archetype: relentless_biomass_pressure
    primary_power_window: early
    tempo: continuous_aggression_from_early_game
    offensive_pattern:
      primary: massive_continuous_assault_stream
      optional_lanes: [2, 3]
      approach: reinforce_pressure_while_mutating_and_scaling
    territorial_pattern: concentrated_clustering
    satellite_base_dispersion: low
    base_network:
      requires_biomass_connection: true
      required_connection_type: physical_living_vessel_to_home_nexus
      biomass_generated_by_structures: true
      role: obligatory_rooted_building_placement_and_viability
      disconnected_branch: gradual_wither_with_grace
      recurring_home_origin_nourishment_to_expansions: true
      individuality_of_detached_units_preserved: true
      interruption_counterplay: root_cut_or_starvation
    preferred_assets:
      - specialized_biological_production
      - irreversible_combat_mutations
      - connected_biomass_territory
    strengths: [initiative, attrition, early_expansion, continuous_reinforcement]
    risks: [predictable_attack_lanes, vulnerable_biomass_links, irreversible_investments]
  man:
    default_archetype: distributed_tactical_modularity
    primary_power_window: mid
    tempo: information_driven_precision
    offensive_pattern:
      primary: cohesive_specialized_strike_groups
      emphasis: [reconnaissance, timing, combined_arms, modular_counterplay]
    defenses: [light_fortifications, bunkers, screening]
    territorial_pattern: widely_dispersed_outposts
    satellite_base_dispersion: high
    expansion:
      - modular_deployable_structures
      - airborne_deployable_structures
      - reusable_building_modules
      - fully_independent_outposts_without_home_tether
      - optional_linking_between_independent_bases
    base_architecture:
      nexus_is_composed_of_units_and_buildings: true
      mobile_crawling_modular_structure: true
      typical_expansion_geometry: radial_and_vertical
      few_structures_permanently_foundation_bound: true
      obligatory_home_contact: false
      repair_specialization: can_repair_units_and_buildings
    preferred_assets: [scouting, bunkers, flying_constructs, hot_swappable_modules]
    strengths: [mobility, surprise, flexible_responses, distributed_map_control]
    risks: [isolated_outpost_raids, supply_chain_interdiction, high_tactical_attention]
  eth:
    default_archetype: fortified_homeworld_ascension
    primary_power_window: late
    tempo: cautious_exploration_and_defensive_development
    offensive_pattern:
      primary: decisive_advanced_force_after_technology_advancement
      emphasis: [survival, positional_control, energy_accumulation]
    territorial_pattern: core_base_plus_moderately_separated_satellites
    satellite_base_dispersion: medium
    core_base:
      fantasy: reconstruct_the_homeworld_as_a_living_sanctuary
      preservation_priority: very_high
      roles: [fortification, technology, resonance, energy_storage]
    base_architecture:
      topology: distributed_nexus_class_nodes_and_mid_pylons
      min_building_requires_network_mode_visible_blue_beam: true
      mid_pylon_modes: [cargo_storage_and_relay, meditated_turret]
      max_role: nexus_class_core_node_from_creation
      structure_relocation: optional_meditation_then_levitation_for_eligible_models
      expansion_home_contact: initial_setup_and_unknown_blueprints_only
      local_known_blueprints_survive_home_disconnection: true
    preferred_assets: [layered_defenses, shields, advanced_units, meditation]
    strengths: [strong_defensive_position, advanced_late_game_units, energy_specialization]
    risks: [early_pressure, core_base_dependency, costly_slow_transformations]
strategic_counterplay:
  - Baseline power windows must not become guaranteed victory windows.
  - Every faction must have viable early, mid, and late strategies.
  - Early Organ pressure needs defensive and economic counters.
  - Dispersed Manus outposts must be vulnerable to raids and disrupted logistics.
  - An entrenched Eter core must have vulnerabilities to siege, containment, or resource denial.
  - Organ live-vessel dependence and recurring home nutrition must include measurable grace, cheap recoverable branching, and meaningful raid counterplay rather than instantaneous unavoidable colony death.
  - Flying Manus expansion must honor specialist deployable-unit restrictions.
  - Eter homeworld reconstruction describes a faction fantasy, not an automatic map-wide terrain overwrite.
creative_influences:
  status: moodboard_only_not_licensed_content
  shared:
    - source: Warhammer 40000
      inspiration: [grimdark_scale, monumental_warfare, civilizational_stakes, imposing_architecture]
      exclusions: [names, insignia, factions, characters, specific_designs, lore]
    - source: Prometheus
      inspiration: [ancient_alien_ruins, unsettling_biotechnology, existential_mystery, monumental_emptiness]
      exclusions: [engineers, recognizable_props, named_locations, storylines]
  org:
    - source: Alien
      inspiration: [predatory_organic_ecology, claustrophobic_hives, architectural_biomass, visceral_mutation]
      exclusions: [xenomorph_anatomy, facehuggers, eggs_as_signature_art, franchise_names]
    - source: Warhammer 40000
      inspiration: [overwhelming_war_scale, relentless_attrition]
      exclusions: [tyranid_visual_identity, named_units, iconography]
  man:
    - source: Warhammer 40000
      inspiration: [field_fortifications, expeditionary_military_scale, industrial_density]
      exclusions: [imperium_symbols, space_marine_armor, recognizable_units]
    - source: Prometheus
      inspiration: [exploration_tension, advanced_field_equipment]
      exclusions: [recognizable_vehicles, ships, props]
  eth:
    - source: Predator
      inspiration: [ritualized_advanced_hunting, heightened_senses, stealth, technological_superiority]
      exclusions: [yautja_anatomy, masks, wrist_blades, shoulder_cannons, signature_symbols]
    - source: Prometheus
      inspiration: [ancient_knowledge, bioengineering_mystery, enigmatic_ceremonial_spaces]
      exclusions: [engineer_anatomy, recognizable_architecture, franchise_lore]
  originality_rules:
    - All silhouettes, terminology, worldbuilding, artwork, audio, and faction symbols must be original.
    - References guide emotional tone and high-level design, never copy franchise-specific execution.
    - Third-party imagery requires separate licensing; no unlicensed assets committed.

# Naming governance: current canonical faction IDs are org/man/eth.
# Legacy IDs blergians/manusians/aetherians are historical only and must not be used for new runtime config.
# See design/faction-identity-rename-2026-10-11.md.

# Canonical names approved on 2026-10-11: short/mid/full; see design/faction-naming-conventions-2026-10-11.md.
# The full names are intentional ORG/MAN/ETH backronyms, not separate inferred political-state names.
